name: Deploy static content to Pages
on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (prod)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site
          fetch-depth: 1
      - name: Clean main .git
        run: rm -rf _site/.git
      - name: Checkout dev (preview)
        uses: actions/checkout@v4
        with:
          ref: dev
          path: _site/dev
          fetch-depth: 1
        continue-on-error: true
      - name: Clean dev .git
        run: rm -rf _site/dev/.git
        continue-on-error: true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
