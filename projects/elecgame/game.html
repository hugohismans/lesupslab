<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ElecGame</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #08080f;
    font-family: 'Courier New', monospace;
    color: #00ffcc;
    user-select: none;
    overflow: hidden;
    height: 100svh;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── GAME AREA ───────────────────────────────────────────── */
  #game-area {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas { display: block; max-width: 100%; height: auto; }

  /* ── HAMBURGER BUTTON ────────────────────────────────────── */
  #menu-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 200;
    background: #0a1a14;
    border: 1px solid #1a5a3a;
    color: #00ffcc;
    font-size: 22px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 6px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #menu-btn:hover { border-color: #00ffcc; box-shadow: 0 0 12px #00ffcc44; }

  /* ── DEATH COUNTER ──────────────────────────────────────── */
  #death-counter {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 150;
    color: #663333;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    pointer-events: none;
    transition: color 0.15s;
  }
  #death-counter.flash { color: #ff4444; }

  /* ── LEVEL TITLE ─────────────────────────────────────────── */
  #level-title {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 150;
    color: #336655;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ── SIDEBAR OVERLAY ─────────────────────────────────────── */
  #sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  #sidebar-overlay.visible { opacity: 1; pointer-events: all; }

  /* ── SIDEBAR ─────────────────────────────────────────────── */
  #sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 300px;
    max-width: 85vw;
    height: 100%;
    background: #060c0a;
    border-right: 1px solid #1a5a3a;
    z-index: 400;
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar.open { transform: translateX(0); }

  #sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid #1a5a3a;
    flex-shrink: 0;
  }
  #sidebar-title {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #224433;
  }
  #sidebar-close {
    background: none;
    border: none;
    color: #446655;
    font-size: 20px;
    cursor: pointer;
    padding: 2px 6px;
    transition: color 0.15s;
  }
  #sidebar-close:hover { color: #00ffcc; }

  #sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #sidebar-body::-webkit-scrollbar { width: 4px; }
  #sidebar-body::-webkit-scrollbar-thumb { background: #1a5a3a; border-radius: 2px; }

  /* ── LEVEL SELECT (inside sidebar) ──────────────────────── */
  #level-select {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .lvl-sep {
    width: 100%;
    height: 1px;
    background: #1a5a3a;
    margin: 4px 0;
  }
  .lvl-group-label {
    font-size: 10px;
    color: #224433;
    letter-spacing: 2px;
    text-transform: uppercase;
    width: 100%;
  }
  .lvl-btn {
    background: #0a1a14;
    border: 1px solid #1a5a3a;
    color: #446655;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    padding: 8px 14px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
    border-radius: 4px;
  }
  .lvl-btn:hover { border-color: #336655; color: #00bb99; }
  .lvl-btn.active {
    border-color: #00ffcc;
    color: #00ffcc;
    background: #0d2a1e;
    box-shadow: 0 0 8px #00ffcc44;
  }

  /* ── HINT ────────────────────────────────────────────────── */
  #hint {
    font-size: 11px;
    color: #446655;
    letter-spacing: 1px;
    line-height: 1.6;
  }

  /* ── REPLAY SAVE ─────────────────────────────────────────── */
  .replay-btn {
    background: transparent;
    border: 1px solid #446655;
    color: #446655;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 4px;
    width: 100%;
  }
  .replay-btn:hover { border-color: #00ffcc; color: #00ffcc; }
  .replay-btn.save   { border-color: #ffaa00; color: #ffaa00; }
  .replay-btn.save:hover { border-color: #ffdd44; color: #ffdd44; box-shadow: 0 0 12px #ffaa0044; }
  .replay-btn.submit { border-color: #aa44ff; color: #aa44ff; }
  .replay-btn.submit:hover { border-color: #cc88ff; color: #cc88ff; box-shadow: 0 0 12px #aa44ff44; }

  /* ── SUBMIT OVERLAY ──────────────────────────────────────── */
  #submit-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 300;
    align-items: center;
    justify-content: center;
  }
  #submit-overlay.open { display: flex; }
  #submit-box {
    background: #050e0a;
    border: 1px solid #6622cc;
    box-shadow: 0 0 30px #6622cc55;
    padding: 28px 32px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-family: 'Courier New', monospace;
    color: #aa66ff;
  }
  #submit-box h3 { margin: 0; font-size: 14px; letter-spacing: 2px; color: #cc88ff; }
  #submit-desc { margin: 0; font-size: 11px; color: #664488; line-height: 1.6; }
  #submit-box input, #submit-box textarea {
    background: #0a0418;
    border: 1px solid #441188;
    color: #cc88ff;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 8px 10px;
    outline: none;
    resize: none;
  }
  #submit-box input:focus, #submit-box textarea:focus { border-color: #aa44ff; }
  #submit-box .submit-btns { display: flex; gap: 8px; justify-content: flex-end; }
  #submit-box button {
    background: transparent;
    border: 1px solid #441188;
    color: #aa66ff;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 7px 16px;
    cursor: pointer;
  }
  #submit-box button.primary { border-color: #aa44ff; color: #cc88ff; }
  #submit-box button.primary:hover { background: #aa44ff22; }
  #submit-box #submit-status { font-size: 11px; min-height: 16px; }

  /* ── NEXT LEVEL OVERLAY ──────────────────────────────────── */
  #next-level-wrap {
    display: none;
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    text-align: center;
  }
  #next-level-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #next-level-wrap button {
    background: transparent;
    font-family: 'Courier New', monospace;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 3px;
    padding: 14px 36px;
    cursor: pointer;
    animation: nxt-pulse 1.2s ease-in-out infinite;
  }
  #next-level-btn {
    border: 2px solid #00ffcc;
    color: #00ffcc;
    box-shadow: 0 0 24px #00ffcc55, inset 0 0 12px #00ffcc11;
  }
  #next-level-btn:hover { background: #00ffcc18; box-shadow: 0 0 40px #00ffccaa; }
  #submit-level-btn {
    border: 2px solid #aa44ff;
    color: #aa44ff;
    font-size: 16px;
    padding: 10px 28px;
    box-shadow: 0 0 18px #aa44ff44;
  }
  #submit-level-btn:hover { background: #aa44ff18; box-shadow: 0 0 32px #aa44ff88; }
  @keyframes nxt-pulse {
    0%, 100% { box-shadow: 0 0 18px #00ffcc55, inset 0 0 8px #00ffcc11; }
    50%       { box-shadow: 0 0 36px #00ffccaa, inset 0 0 16px #00ffcc22; }
  }

  /* ── TOUCH CONTROLS ──────────────────────────────────────── */
  #touch-controls {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    gap: 12px;
    align-items: center;
    justify-content: center;
    padding: 10px 12px;
    background: rgba(6, 6, 14, 0.88);
    border-top: 1px solid #1a4035;
    z-index: 100;
  }
  @media (hover: none) and (pointer: coarse) {
    #touch-controls { display: flex; }
    body { padding-bottom: 100px; }
  }
  .touch-btn {
    height: 72px;
    width: 84px;
    border: 2px solid currentColor;
    background: transparent;
    font-family: 'Courier New', monospace;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.08s, box-shadow 0.08s;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .touch-btn.q-btn  { color: #ffaa00; box-shadow: 0 0 14px #ffaa0033; }
  .touch-btn.p-btn  { color: #cc44ff; box-shadow: 0 0 14px #cc44ff33; }
  .touch-btn.q-btn.pressed  { background: #ffaa0044; box-shadow: 0 0 26px #ffaa0088; }
  .touch-btn.p-btn.pressed  { background: #cc44ff44; box-shadow: 0 0 26px #cc44ff88; }
  .touch-btn.space-btn {
    color: #aaaaaa; box-shadow: 0 0 8px #aaaaaa22;
    width: 140px; font-size: 13px; letter-spacing: 2px;
  }
  .touch-btn.space-btn.pressed { background: #aaaaaa22; }
  .touch-btn.restart-btn {
    color: #00ffcc; box-shadow: 0 0 8px #00ffcc22;
    width: 64px; font-size: 26px;
  }
  .touch-btn.restart-btn.pressed { background: #00ffcc22; }
</style>
</head>
<body>

<!-- Hamburger -->
<button id="menu-btn">☰</button>

<!-- Level title -->
<div id="level-title">Tutoriel 1</div>

<!-- Death counter -->
<div id="death-counter">💀 0</div>

<!-- Sidebar backdrop -->
<div id="sidebar-overlay"></div>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <span id="sidebar-title">Niveaux</span>
    <button id="sidebar-close">✕</button>
  </div>
  <div id="sidebar-body">
    <div id="level-select"></div>
    <div id="hint"></div>
    <div id="replay-save-wrap" style="display:none;"></div>
  </div>
</div>

<!-- Next level overlay -->
<div id="next-level-wrap">
  <button id="next-level-btn"></button>
  <button id="submit-level-btn" style="display:none">📤 SOUMETTRE À L'ADMIN</button>
</div>

<!-- Submit overlay -->
<div id="submit-overlay">
  <div id="submit-box">
    <h3>📤 SOUMETTRE À L'ADMIN</h3>
    <p id="submit-desc">Tu viens de résoudre ton niveau — envoie-le à l'admin pour qu'il soit reviewé et potentiellement ajouté au site.<br><br>⏳ Une seule soumission par heure est autorisée.</p>
    <input id="submit-name" type="text" placeholder="Ton prénom / pseudo" maxlength="40">
    <textarea id="submit-msg" rows="3" placeholder="Un message ? (optionnel)"></textarea>
    <div id="submit-status"></div>
    <div class="submit-btns">
      <button id="submit-cancel">Annuler</button>
      <button id="submit-send" class="primary">Envoyer →</button>
    </div>
  </div>
</div>

<!-- Hidden file inputs -->
<input type="file" id="ext-level-input" accept=".json" style="display:none">
<input type="file" id="replay-input" accept=".json" style="display:none">

<!-- Main game area -->
<div id="game-area">
  <canvas id="c" width="800" height="300" tabindex="0"></canvas>
  <div id="touch-controls">
    <button class="touch-btn q-btn"       id="btn-q">Q</button>
    <button class="touch-btn space-btn"   id="btn-space">ESPACE</button>
    <button class="touch-btn p-btn"       id="btn-p">P</button>
    <button class="touch-btn restart-btn" id="btn-restart">↺</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = canvas.width, H = canvas.height;

function setCanvasSize(w, h) {
  W = w; H = h;
  canvas.width  = w;
  canvas.height = h;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
}

// ── CONSTANTS ──────────────────────────────────────────────
const WIRE_START = 60;
const WIRE_END   = 740;
const WIRE_Y     = H / 2;     // 150
const BALL_R     = 9;
const BALL_SPEED = 132; // px/s (= 2.2 px/frame × 60 fps)
const SW_GAP     = 28;        // half-gap around switch center

// Level 2 split geometry
const SPLIT_X  = 200;
const JOIN_X   = 600;
const TOP_Y    = WIRE_Y - 65; // 85
const BOT_Y    = WIRE_Y + 65; // 215
const BEVEL    = 35;          // horizontal extent of the angled connector

const BEVEL_HALF = BEVEL; // alias, already defined

// ── CAMERA (custom levels only) ────────────────────────────
let camTX = 0, camTY = 0, camScale = 1; // applied via ctx.setTransform

function fitCustomLevel(st) {
  const ns = st.graph.nodes;
  if (!ns.length) return;
  const PAD = 60;
  const xs = ns.map(n => n.x), ys = ns.map(n => n.y);
  const minX = Math.min(...xs) - PAD, maxX = Math.max(...xs) + PAD;
  const minY = Math.min(...ys) - PAD, maxY = Math.max(...ys) + PAD;
  const ww = maxX - minX, wh = maxY - minY;
  camScale = Math.min(W / ww, H / wh, 2); // cap at 2× to avoid huge nodes
  camTX = W / 2 - (minX + ww / 2) * camScale;
  camTY = H / 2 - (minY + wh / 2) * camScale;
}

// ── LEVELS ─────────────────────────────────────────────────
const LEVELS = [
  {
    name: 'Tutoriel 1',
    hint: 'Maintiens [Q] pour fermer l\'interrupteur — [R] pour recommencer',
    make: () => ({
      type: 'single',
      ball: WIRE_START,
      won: false, dead: false, waiting: true,
      switches: [{ x: 400, key: 'Q', initOpen: true, open: true }]
    })
  },
  {
    name: 'Tutoriel 2',
    hint: 'Maintiens [Q] et [P] simultanément — [R] pour recommencer',
    make: () => ({
      type: 'split',
      ballX: WIRE_START,
      phase: 'main',
      won: false, dead: false, waiting: true,
      switches: [
        { x: 400, key: 'Q', initOpen: true, open: true, trackY: TOP_Y },
        { x: 400, key: 'P', initOpen: true, open: true, trackY: BOT_Y }
      ]
    })
  },
  {
    name: 'Tutoriel 3',
    hint: '[Q] ▶ relâche [Q] ▶ [P] ▶ relâche [P] — [R] pour recommencer',
    make: () => ({
      type: 'single',
      ball: WIRE_START,
      won: false, dead: false, waiting: true,
      // séquence : hold Q → release Q → hold P → release P
      switches: [
        { x: 190, key: 'Q', initOpen: true,  open: true  },  // ouvert  → hold Q
        { x: 340, key: 'Q', initOpen: false, open: false },  // fermé   → release Q
        { x: 490, key: 'P', initOpen: true,  open: true  },  // ouvert  → hold P
        { x: 620, key: 'P', initOpen: false, open: false },  // fermé   → release P
      ]
    })
  }
];

// ── CAMPAIGN SEQUENCE ──────────────────────────────────────
const CAMPAIGN = [
  { idx: 0 },  // Tutoriel 1
  { idx: 1 },  // Tutoriel 2
  { idx: 2 },  // Tutoriel 3
  { file: 'levels/TUTO4_resistance_eclair.json' },
  { file: 'levels/tuto5_microprocesseur.json' },
  { file: 'levels/complex_twoway.json' },
  { file: 'levels/67.json' },
  { file: 'levels/levelHard.json' },
];

function campaignPos() {
  const lv = LEVELS[currentLevel];
  return CAMPAIGN.findIndex(c =>
    c.idx !== undefined ? c.idx === currentLevel : (lv && lv._file === c.file)
  );
}

function goNextCampaign(campIdx) {
  const entry = CAMPAIGN[campIdx];
  if (entry.idx !== undefined) {
    selectLevel(entry.idx);
  } else {
    let lvIdx = LEVELS.findIndex(lv => lv._file === entry.file);
    if (lvIdx < 0) {
      // Pas dans index.json — créer une entrée dynamique
      lvIdx = LEVELS.length;
      LEVELS.push({
        name: entry.file.split('/').pop().replace('.json', ''),
        hint: '— [R] pour recommencer',
        _file: entry.file, _json: null,
        make() { if (!this._json) throw new Error('not loaded'); return makeCustomLevel(this._json); }
      });
    }
    const lv = LEVELS[lvIdx];
    if (lv._json) {
      selectLevel(lvIdx);
    } else {
      fetch(lv._file)
        .then(r => r.json())
        .then(json => { lv._json = json; lv.hint = (json.name || lv.name) + ' — [R] pour recommencer'; selectLevel(lvIdx); })
        .catch(() => alert('Impossible de charger ' + entry.file));
    }
  }
}

let currentLevel = 0;
let state = LEVELS[0].make();
const keys = {};

function selectLevel(idx) {
  replayMode = false;
  for (const k in keys) keys[k] = false;
  stopHum(true);
  currentLevel = idx;
  try { state = LEVELS[idx].make(); } catch(e) { return; } // not loaded yet
  // Resize canvas and compute fit transform for custom levels
  const touchH = window.matchMedia('(hover: none) and (pointer: coarse)').matches ? 100 : 0;
  if (state.type === 'custom') {
    const cw = window.innerWidth;
    const ch = Math.max(200, window.innerHeight - touchH);
    setCanvasSize(cw, ch);
    canvas.style.width  = cw + 'px';
    canvas.style.height = ch + 'px';
    fitCustomLevel(state);
  } else {
    setCanvasSize(800, 300);
    canvas.style.width  = '';
    canvas.style.height = '';
    camTX = 0; camTY = 0; camScale = 1;
  }
  document.getElementById('hint').textContent = LEVELS[idx].hint || '';
  // Update sidebar title
  const sidebarTitle = document.getElementById('sidebar-title');
  if (sidebarTitle) sidebarTitle.textContent = LEVELS[idx].name || 'Niveaux';
  const levelTitleEl = document.getElementById('level-title');
  if (levelTitleEl) levelTitleEl.textContent = LEVELS[idx].name || '';
  document.querySelectorAll('.lvl-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.getElementById('replay-save-wrap').style.display = 'none';
  document.getElementById('next-level-wrap').style.display = 'none';
  document.getElementById('submit-level-btn').style.display = 'none';
  startRecording();
  if (AC) startHum();
}

// Build level buttons
const lsDiv = document.getElementById('level-select');

function addSep() {
  const s = document.createElement('div'); s.className = 'lvl-sep'; lsDiv.appendChild(s);
}
function addGroupLabel(txt) {
  const s = document.createElement('span'); s.className = 'lvl-group-label'; s.textContent = txt; lsDiv.appendChild(s);
}
function addLevelBtn(lv, idx) {
  const btn = document.createElement('button');
  btn.className = 'lvl-btn';
  btn.textContent = lv.name;
  btn.onclick = () => selectLevel(idx);
  lsDiv.appendChild(btn);
  return btn;
}

addGroupLabel('TUTORIAUX');
LEVELS.forEach((lv, i) => addLevelBtn(lv, i));

// Separator + levels folder group (populated after fetch)
addSep();
addGroupLabel('NIVEAUX');

// Load-external button
const btnLoadExt = document.createElement('button');
btnLoadExt.className = 'lvl-btn';
btnLoadExt.id = 'btn-load-ext';
btnLoadExt.textContent = '📂';
lsDiv.appendChild(btnLoadExt);

// Replay load button
const btnLoadReplay = document.createElement('button');
btnLoadReplay.className = 'lvl-btn';
btnLoadReplay.title = 'Charger un replay';
btnLoadReplay.textContent = '▶ Replay';
lsDiv.appendChild(btnLoadReplay);
btnLoadReplay.onclick = () => document.getElementById('replay-input').click();

// Load levels from levels/index.json
fetch('levels/index.json')
  .then(r => r.json())
  .then(list => {
    list.forEach(entry => {
      const idx = LEVELS.length;
      // Placeholder until JSON loaded; make() fetches on demand
      const lv = {
        name: entry.name,
        hint: entry.name + ' — [R] pour recommencer',
        _file: 'levels/' + entry.file,
        _json: null,
        make() {
          if (!this._json) throw new Error('not loaded');
          return makeCustomLevel(this._json);
        }
      };
      LEVELS.push(lv);
      const btn = addLevelBtn(lv, idx);
      // Fetch JSON when clicked (lazy load)
      btn.onclick = () => {
        if (lv._json) { selectLevel(idx); return; }
        fetch(lv._file)
          .then(r => r.json())
          .then(json => { lv._json = json; lv.hint = json.name + ' — [R] pour recommencer'; selectLevel(idx); })
          .catch(() => alert('Impossible de charger ' + entry.file));
      };
    });
  })
  .catch(() => {}); // silently ignore if no levels/index.json

// Space spam counter — consumed each frame by resistance logic
let spacePressCount = 0;

// ── RECORDER ───────────────────────────────────────────────
let recorder = { active: false, startTime: 0, inputs: [], levelName: '', levelJSON: null, wonTime: 0 };

// ── SUBMIT CONFIG ──────────────────────────────────────────
const SUBMIT_WEBHOOK = 'https://discord.com/api/webhooks/1488707248552415374/_0b7EP6UKqM3tYxLtUmjksYnDGgvAvmnEN1ODeEjLCLT_73lGfs2HfqTGkso2Ke0FqNJ';
const isTestMode = new URLSearchParams(location.search).has('test');

// ── DEATH COUNTER ──────────────────────────────────────────
const SAVE_KEY = 'elecgame_save';
function loadSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch { return {}; }
}
function writeSave(data) {
  localStorage.setItem(SAVE_KEY, JSON.stringify({ ...loadSave(), ...data }));
}
let deathCount = loadSave().deaths || 0;
function updateDeathDisplay() {
  const el = document.getElementById('death-counter');
  if (el) el.textContent = '💀 ' + deathCount;
}
function registerDeath() {
  deathCount++;
  writeSave({ deaths: deathCount });
  updateDeathDisplay();
  const el = document.getElementById('death-counter');
  if (el) {
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 400);
  }
}
updateDeathDisplay();

function startRecording() {
  const lv = LEVELS[currentLevel];
  recorder = {
    active: true,
    startTime: Date.now(),
    inputs: [],
    levelName: lv ? lv.name : 'Unknown',
    levelJSON: (lv && lv._json) ? lv._json : null,
    wonTime: 0
  };
}

function recordKey(type, key) {
  if (!recorder.active) return;
  recorder.inputs.push({ type, key, t: Date.now() - recorder.startTime });
}

function stopRecordingWin() {
  if (!recorder.active) return;
  recorder.active = false;
  recorder.wonTime = Date.now() - recorder.startTime;
  const wrap = document.getElementById('replay-save-wrap');
  wrap.innerHTML = '';

  const btn = document.createElement('button');
  btn.className = 'replay-btn save';
  btn.textContent = '💾 Sauvegarder le replay';
  btn.onclick = downloadReplay;
  wrap.appendChild(btn);
  wrap.style.display = '';
}

function downloadReplay() {
  const data = {
    levelName: recorder.levelName,
    levelJSON: recorder.levelJSON,
    duration: recorder.wonTime,
    inputs: recorder.inputs
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = recorder.levelName.toLowerCase().replace(/\s+/g, '_') + '_replay.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ── SUBMIT TO ADMIN ────────────────────────────────────────
const SUBMIT_COOLDOWN_MS = 60 * 60 * 1000; // 1 heure

function openSubmitOverlay() {
  const lastSubmit = parseInt(loadSave().lastSubmit || 0);
  const remaining  = SUBMIT_COOLDOWN_MS - (Date.now() - lastSubmit);
  const status     = document.getElementById('submit-status');

  if (remaining > 0) {
    const mins = Math.ceil(remaining / 60000);
    document.getElementById('submit-overlay').classList.add('open');
    status.style.color = '#ff8800';
    status.textContent = `⏳ Réessaie dans ${mins} min`;
    document.getElementById('submit-send').disabled = true;
    return;
  }

  status.textContent = '';
  document.getElementById('submit-send').disabled = false;
  document.getElementById('submit-overlay').classList.add('open');
  document.getElementById('submit-name').focus();
}

document.getElementById('submit-cancel').onclick = () => {
  document.getElementById('submit-overlay').classList.remove('open');
};

document.getElementById('submit-send').onclick = async () => {
  if (!SUBMIT_WEBHOOK) return;
  const name    = document.getElementById('submit-name').value.trim() || 'Anonyme';
  const msg     = document.getElementById('submit-msg').value.trim();
  const status  = document.getElementById('submit-status');
  const sendBtn = document.getElementById('submit-send');

  const levelJSON  = localStorage.getItem('elecgame_test_level') || '{}';
  const levelName  = JSON.parse(levelJSON).name || 'level';
  const replayData = {
    levelName: recorder.levelName || levelName,
    levelJSON: JSON.parse(levelJSON),
    duration:  recorder.wonTime,
    inputs:    recorder.inputs
  };

  status.style.color = '#aa66ff';
  status.textContent = 'Envoi en cours…';
  sendBtn.disabled = true;

  try {
    const form = new FormData();
    const content = `**Nouvelle soumission de niveau**\n👤 ${name}${msg ? '\n💬 ' + msg : ''}\n⏱ ${(replayData.duration / 1000).toFixed(2)}s`;
    form.append('payload_json', JSON.stringify({ content }));
    form.append('files[0]', new Blob([JSON.stringify(JSON.parse(levelJSON), null, 2)], { type: 'application/json' }), levelName + '.json');
    form.append('files[1]', new Blob([JSON.stringify(replayData, null, 2)], { type: 'application/json' }), levelName + '_replay.json');

    const res = await fetch(SUBMIT_WEBHOOK, { method: 'POST', body: form });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    writeSave({ lastSubmit: Date.now() });
    status.style.color = '#00ff88';
    status.textContent = '✓ Envoyé !';
    sendBtn.disabled = false;
    setTimeout(() => document.getElementById('submit-overlay').classList.remove('open'), 1500);
  } catch (err) {
    status.style.color = '#ff4444';
    status.textContent = '✗ Erreur : ' + err.message;
    sendBtn.disabled = false;
  }
};

// ── REPLAY PLAYBACK ────────────────────────────────────────
let replayMode = false;
let replayData = null;
let replayStartTime = 0;
let replayInputIdx = 0;

function loadReplayFile(json) {
  // Load level first (selectLevel resets replayMode and starts recording)
  if (json.levelJSON) {
    const existing = LEVELS.findIndex(l => l._json && l.name === json.levelName);
    if (existing >= 0) {
      selectLevel(existing);
    } else {
      const lv = {
        name: json.levelName || 'Replay',
        hint: (json.levelName || 'Replay') + ' — replay',
        _json: json.levelJSON,
        make: function() { return makeCustomLevel(this._json); }
      };
      const idx = LEVELS.length;
      LEVELS.push(lv);
      const btn = document.createElement('button');
      btn.className = 'lvl-btn';
      btn.textContent = lv.name;
      btn.onclick = () => selectLevel(idx);
      lsDiv.insertBefore(btn, btnLoadExt);
      selectLevel(idx);
    }
  }

  // Override to replay mode AFTER selectLevel
  state.waiting = false; // replay starts immediately
  replayMode = true;
  replayData = json;
  replayInputIdx = 0;
  replayStartTime = Date.now();
  for (const k in keys) keys[k] = false;
  spacePressCount = 0;
  recorder.active = false;
}

function updateReplay() {
  if (!replayMode || !replayData) return;
  const elapsed = Date.now() - replayStartTime;
  while (replayInputIdx < replayData.inputs.length) {
    const inp = replayData.inputs[replayInputIdx];
    if (inp.t > elapsed) break;
    const k = inp.key === ' ' ? ' ' : inp.key.toUpperCase();
    if (inp.type === 'keydown') {
      keys[k] = true;
      if (inp.key === ' ') spacePressCount++;
    } else {
      keys[k] = false;
    }
    replayInputIdx++;
  }
  // Auto-end replay 2s after last input
  if (replayInputIdx >= replayData.inputs.length &&
      elapsed > (replayData.duration || 0) + 2000) {
    replayMode = false;
    for (const k in keys) keys[k] = false;
  }
}

// Exit replay on any click anywhere (capture phase, before onclick fires)
document.addEventListener('click', e => {
  if (!replayMode) return;
  replayMode = false;
  for (const k in keys) keys[k] = false;
  recorder.active = false;
  // If clicked element is a level button, let its onclick fire normally
  // (selectLevel will be called, which also resets replayMode — harmless double-reset)
}, true);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key.toUpperCase();
  if (replayMode) {
    if (k === 'R') { replayMode = false; for (const k2 in keys) keys[k2] = false; selectLevel(currentLevel); }
    e.preventDefault();
    return;
  }

  // Capture chiffres pour défi microprocesseur
  if (state.type === 'custom' && state.microChallenge && !state.dead && !state.won) {
    if (e.key >= '0' && e.key <= '9') {
      const digit = parseInt(e.key);
      const mc = state.microChallenge;
      mc.entered.push(digit);
      const pos = mc.entered.length - 1;
      if (mc.code[pos] !== digit) {
        state.dead = true; sfxDead();
      } else if (mc.entered.length === 3) {
        if (mc.ballRef) mc.ballRef.microSolved = true;
        state.microChallenge = null;
        sfxSwitchClose();
      }
      e.preventDefault();
      return;
    }
  }

  keys[k] = true;
  if (e.key === ' ') { spacePressCount++; recordKey('keydown', ' '); }
  else if (k !== 'R') recordKey('keydown', k);
  if (k === 'R') selectLevel(currentLevel);
  // Espace pour valider "Niveau suivant" quand le bouton est visible
  if (e.key === ' ') {
    const nlWrap = document.getElementById('next-level-wrap');
    if (nlWrap && nlWrap.style.display !== 'none' && nlWrap.style.display !== '') {
      document.getElementById('next-level-btn').click();
    }
  }
  resumeAudio();
  if (!humOsc) startHum();
  e.preventDefault();
});
document.addEventListener('keyup', e => {
  if (replayMode) return;
  const k = e.key.toUpperCase();
  keys[k] = false;
  if (e.key === ' ') recordKey('keyup', ' ');
  else if (k !== 'R') recordKey('keyup', k);
});

// ── AUDIO ──────────────────────────────────────────────────
let AC = null;
let humOsc = null, humGain = null;
let noiseBuffer = null;

function resumeAudio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
}

function getNoise() {
  if (noiseBuffer) return noiseBuffer;
  const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  noiseBuffer = buf;
  return buf;
}

function startHum() {
  if (!AC || humOsc) return;
  // 60 Hz sawtooth (sector hum) + 120 Hz harmonic
  humOsc = AC.createOscillator();
  humOsc.type = 'sawtooth';
  humOsc.frequency.value = 60;
  const h2 = AC.createOscillator();
  h2.type = 'square';
  h2.frequency.value = 120;
  const g2 = AC.createGain();
  g2.gain.value = 0.004;
  humGain = AC.createGain();
  humGain.gain.setValueAtTime(0.001, AC.currentTime);
  humGain.gain.linearRampToValueAtTime(0.010, AC.currentTime + 0.6);
  humOsc.connect(humGain);
  h2.connect(g2); g2.connect(humGain);
  humGain.connect(AC.destination);
  humOsc.start(); h2.start();
  humOsc._h2 = h2; // keep ref for cleanup
}

function stopHum(fast) {
  if (!humGain) return;
  const t = fast ? 0.08 : 0.4;
  humGain.gain.setValueAtTime(humGain.gain.value, AC.currentTime);
  humGain.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + t);
  const h = humOsc;
  setTimeout(() => { try { h.stop(); h._h2.stop(); } catch(e){} }, (t + 0.05) * 1000);
  humOsc = null; humGain = null;
}

function noiseBurst(freq, q, vol, dur) {
  if (!AC) return;
  const src = AC.createBufferSource();
  src.buffer = getNoise();
  src.loop = true;
  const f = AC.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start(); src.stop(AC.currentTime + dur);
}

function toneBlip(freq, endFreq, type, vol, dur) {
  if (!AC) return;
  const osc = AC.createOscillator();
  const g   = AC.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, AC.currentTime);
  if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, AC.currentTime + dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  osc.connect(g); g.connect(AC.destination);
  osc.start(); osc.stop(AC.currentTime + dur + 0.01);
}

// Switch closes: sharp electric snap
function sfxSwitchClose() {
  toneBlip(1400, 80, 'square', 0.22, 0.055);
  noiseBurst(4000, 3, 0.12, 0.04);
}

// Switch opens: lighter click
function sfxSwitchOpen() {
  toneBlip(600, 200, 'square', 0.10, 0.04);
}

// Ball passes a closed switch: brief crackle spark
function sfxSpark() {
  noiseBurst(3500, 5, 0.09, 0.06);
  toneBlip(900, 300, 'sawtooth', 0.07, 0.05);
}

// Resistance buzz (called each frame ball is in resistance)
function sfxResistance() {
  noiseBurst(200 + Math.random() * 300, 2, 0.06, 0.04);
}

// Ball splits into two
function sfxSplit() {
  toneBlip(440, 880, 'sine', 0.10, 0.12);
  setTimeout(() => toneBlip(440, 880, 'sine', 0.07, 0.10), 30);
}

// Ball rejoins
function sfxJoin() {
  toneBlip(660, 330, 'sine', 0.09, 0.10);
}

// Court-circuit
function sfxDead() {
  stopHum(true);
  // Burst of crackles
  [0, 40, 90, 150, 220].forEach((ms, i) => {
    setTimeout(() => noiseBurst(800 - i * 120, 1.5, 0.35 - i * 0.05, 0.12), ms);
  });
  toneBlip(180, 25, 'sawtooth', 0.3, 0.7);
}

// Circuit complet
function sfxWin() {
  if (!AC) return;
  stopHum(true);
  const notes = [261, 329, 392, 523, 659, 784, 1046];
  notes.forEach((f, i) => {
    const t = AC.currentTime + i * 0.075;
    const osc = AC.createOscillator(), g = AC.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.13, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
    osc.connect(g); g.connect(AC.destination);
    osc.start(t); osc.stop(t + 0.56);
  });
  // Final sustained chord
  [523, 659, 784].forEach(f => {
    const t = AC.currentTime + 0.6;
    const osc = AC.createOscillator(), g = AC.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.09, t + 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
    osc.connect(g); g.connect(AC.destination);
    osc.start(t); osc.stop(t + 1.5);
  });
}

// ── UPDATE ─────────────────────────────────────────────────
function update(dt) {
  if (state.won || state.dead) return;
  if (state.waiting) {
    const anyKey = Object.values(keys).some(v => v);
    if (!anyKey) return;
    state.waiting = false;
  }

  if (state.type === 'custom') { updateCustom(dt); return; }

  // Switch state + sound on change
  for (const sw of state.switches) {
    const wasOpen = sw.open;
    sw.open = sw.initOpen !== !!keys[sw.key];
    if (sw.open !== wasOpen) {
      if (!sw.open) sfxSwitchClose();
      else          sfxSwitchOpen();
    }
  }

  const move = BALL_SPEED * dt;

  if (state.type === 'single') {
    state.ball += move;
    for (const sw of state.switches) {
      if (sw.open && state.ball >= sw.x - SW_GAP && state.ball <= sw.x + SW_GAP) {
        state.dead = true; sfxDead(); return;
      }
      if (!sw.open && Math.abs(state.ball - (sw.x + SW_GAP)) < move + 2) sfxSpark();
    }
    if (state.ball >= WIRE_END - BALL_R) {
      state.ball = WIRE_END - BALL_R; state.won = true; sfxWin();
    }

  } else {
    state.ballX += move;
    const prevPhase = state.phase;

    if (state.phase === 'main'      && state.ballX >= SPLIT_X)          state.phase = 'splitting';
    if (state.phase === 'splitting' && state.ballX >= SPLIT_X + BEVEL)  state.phase = 'split';
    if (state.phase === 'split'     && state.ballX >= JOIN_X - BEVEL)   state.phase = 'joining';
    if (state.phase === 'joining'   && state.ballX >= JOIN_X)           state.phase = 'join';

    if (prevPhase !== state.phase) {
      if (state.phase === 'splitting') sfxSplit();
      if (state.phase === 'join')      sfxJoin();
    }

    if (state.phase === 'split') {
      for (const sw of state.switches) {
        if (sw.open && state.ballX >= sw.x - SW_GAP && state.ballX <= sw.x + SW_GAP) {
          state.dead = true; sfxDead(); return;
        }
        if (!sw.open && Math.abs(state.ballX - (sw.x + SW_GAP)) < move + 2) sfxSpark();
      }
    }

    if (state.ballX >= WIRE_END - BALL_R) {
      state.ballX = WIRE_END - BALL_R; state.won = true; sfxWin();
    }
  }
}

// ── DRAW HELPERS ───────────────────────────────────────────
function line(x1, y1, x2, y2, color, width, glow) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = width;
  if (glow) { ctx.shadowBlur = glow; ctx.shadowColor = color; }
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}

function wire(x1, x2, y, active, y2) {
  const color = active ? '#00ffcc' : '#1a4035';
  const glow  = active ? 12 : 0;
  const width = active ? 3 : 2;
  if (y2 === undefined) line(x1, y, x2, y, color, width, glow);
  else                  line(x1, y, x2, y2, color, width, glow);
}

// Color per key
const KEY_COLOR = {
  Q: { main: '#ffaa00', glow: '#ff6600', dim: '#3a2a00' },
  P: { main: '#cc44ff', glow: '#8800ff', dim: '#2a0040' },
};
function keyColor(key) { return KEY_COLOR[key] || { main: '#00ffcc', glow: '#00ffcc', dim: '#1a4035' }; }

function dot(x, y, active) {
  ctx.save();
  ctx.fillStyle = active ? '#00ffcc' : '#1a4035';
  if (active) { ctx.shadowBlur = 10; ctx.shadowColor = '#00ffcc'; }
  ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSwitch(sw) {
  const { x, open } = sw;
  const y = sw.trackY !== undefined ? sw.trackY : WIRE_Y;
  const g = SW_GAP;
  const isTop = sw.trackY !== undefined && sw.trackY < WIRE_Y;
  const c = keyColor(sw.key);

  // Terminals
  ctx.save();
  ctx.shadowBlur = 8; ctx.shadowColor = c.main;
  ctx.fillStyle = c.main;
  ctx.beginPath(); ctx.arc(x - g, y, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + g, y, 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  if (!open) {
    line(x - g, y, x + g, y, c.main, 3, 14);
  } else {
    ctx.save();
    ctx.strokeStyle = c.main; ctx.lineWidth = 2.5;
    ctx.shadowBlur = 8; ctx.shadowColor = c.glow;
    ctx.beginPath();
    ctx.moveTo(x - g, y);
    ctx.lineTo(x + g * 0.4, y - 32);
    ctx.stroke();
    ctx.restore();
  }

  // Label: above for top track, below for others
  const labelY = isTop ? y - 42 : y + 44;
  ctx.save();
  ctx.font = 'bold 12px Courier New';
  ctx.textAlign = 'center';
  ctx.fillStyle = c.main;
  ctx.shadowBlur = open ? 0 : 6; ctx.shadowColor = c.glow;
  ctx.fillText('[' + sw.key + ']', x, labelY);
  ctx.restore();
}

function drawBall(x, y) {
  const grd = ctx.createRadialGradient(x, y, 0, x, y, 26);
  grd.addColorStop(0, 'rgba(80,180,255,0.6)');
  grd.addColorStop(1, 'rgba(0,80,255,0)');
  ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2);
  ctx.fillStyle = grd; ctx.fill();

  ctx.save();
  ctx.shadowBlur = 18; ctx.shadowColor = '#88ddff';
  const core = ctx.createRadialGradient(x - 3, y - 3, 1, x, y, BALL_R);
  core.addColorStop(0, '#ffffff');
  core.addColorStop(0.5, '#88ccff');
  core.addColorStop(1, '#0055ff');
  ctx.beginPath(); ctx.arc(x, y, BALL_R, 0, Math.PI * 2);
  ctx.fillStyle = core; ctx.fill();
  ctx.restore();
}

function drawBulb(lit, x, y) {
  if (x === undefined) { x = WIRE_END; y = WIRE_Y; }
  if (lit) {
    const grd = ctx.createRadialGradient(x, y - 16, 5, x, y - 16, 55);
    grd.addColorStop(0, 'rgba(255,255,120,0.7)');
    grd.addColorStop(1, 'rgba(255,200,0,0)');
    ctx.beginPath(); ctx.arc(x, y - 16, 55, 0, Math.PI * 2);
    ctx.fillStyle = grd; ctx.fill();
  }
  ctx.save();
  if (lit) { ctx.shadowBlur = 20; ctx.shadowColor = '#ffff00'; }
  ctx.beginPath(); ctx.arc(x, y - 16, 16, 0, Math.PI * 2);
  ctx.fillStyle = lit ? '#ffff88' : '#1a2a1a'; ctx.fill();
  ctx.strokeStyle = lit ? '#ffdd00' : '#336633'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  ctx.fillStyle = lit ? '#cccccc' : '#334433';
  ctx.fillRect(x - 9, y, 18, 10); ctx.fillRect(x - 6, y + 10, 12, 5);
  ctx.save();
  ctx.strokeStyle = lit ? '#ff8800' : '#224422'; ctx.lineWidth = 1.5;
  if (lit) { ctx.shadowBlur = 8; ctx.shadowColor = '#ff8800'; }
  ctx.beginPath();
  ctx.moveTo(x - 4, y - 6); ctx.lineTo(x - 1, y - 14);
  ctx.lineTo(x + 2, y - 8); ctx.lineTo(x + 5, y - 16);
  ctx.stroke(); ctx.restore();
}

function drawSource(x, y) {
  if (x === undefined) { x = WIRE_START; y = WIRE_Y; }
  ctx.save();
  ctx.shadowBlur = 10; ctx.shadowColor = '#00ffcc';
  ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2;
  ctx.strokeRect(x - 14, y - 18, 28, 36);
  ctx.fillStyle = '#00ffcc';
  ctx.font = 'bold 16px Courier New';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('⚡', x, y);
  ctx.restore();
}

function drawKeyIndicator(key, px, py) {
  const held = !!keys[key];
  const c = keyColor(key);
  ctx.save();
  ctx.font = 'bold 14px Courier New'; ctx.textAlign = 'left';
  ctx.fillStyle = held ? c.main : c.dim;
  ctx.shadowBlur = held ? 10 : 0; ctx.shadowColor = c.glow;
  ctx.fillText(key + '  ' + (held ? '█ FERMÉ' : '░ OUVERT'), px, py);
  ctx.restore();
}

function drawOverlay(text, color, glow) {
  ctx.save();
  ctx.font = 'bold 30px Courier New'; ctx.textAlign = 'center';
  ctx.shadowBlur = 20; ctx.shadowColor = glow;
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, 40);
  ctx.font = '15px Courier New'; ctx.fillStyle = '#aaaaaa'; ctx.shadowBlur = 0;
  ctx.fillText('[R] pour recommencer', W / 2, 66);
  ctx.restore();
}

function drawWaiting() {
  const pulse = 0.55 + 0.45 * Math.sin(Date.now() / 400);
  ctx.save();
  ctx.font = 'bold 16px Courier New'; ctx.textAlign = 'center';
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#00ffcc';
  ctx.shadowBlur = 18; ctx.shadowColor = '#00ffcc';
  ctx.fillText('▶  APPUIE SUR UNE TOUCHE', W / 2, H / 2 - 18);
  ctx.globalAlpha = pulse * 0.6;
  ctx.font = '11px Courier New'; ctx.fillStyle = '#446655'; ctx.shadowBlur = 0;
  ctx.fillText('Q   ESPACE   P', W / 2, H / 2 + 8);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ── DRAW LEVEL 1 (single line, N switches) ─────────────────
function drawLevel1() {
  const ball = state.ball;
  const sws  = state.switches;

  // Build ordered segment list: source → [left, right terminal per switch] → bulb
  const points = [WIRE_START + 14];
  for (const sw of sws) { points.push(sw.x - SW_GAP); points.push(sw.x + SW_GAP); }
  points.push(WIRE_END - 2);
  // Draw each gap-free segment
  for (let i = 0; i < points.length - 1; i += 2) {
    const x1 = points[i], x2 = points[i + 1];
    wire(x1, x2, WIRE_Y, ball > x1 || state.won);
  }

  drawSource();
  for (const sw of sws) drawSwitch(sw);
  drawBulb(state.won);
  if (!state.won && !state.dead) drawBall(ball, WIRE_Y);

  // Key indicators
  const usedKeys = [...new Set(sws.map(sw => sw.key))];
  usedKeys.forEach((k, i) => drawKeyIndicator(k, 20, 28 + i * 22));
}

// ── DRAW LEVEL 2 ───────────────────────────────────────────
function drawLevel2() {
  const bx    = state.ballX;
  const phase = state.phase;
  const swQ   = state.switches[0]; // top
  const swP   = state.switches[1]; // bottom

  const pastSplit = bx > SPLIT_X;
  const pastQ     = bx > swQ.x + SW_GAP;
  const pastP     = bx > swP.x + SW_GAP;
  const pastJoin  = bx > JOIN_X;

  // Main wire before split
  wire(WIRE_START + 14, SPLIT_X, WIRE_Y, true);

  // Angled connectors: split → tracks
  wire(SPLIT_X, SPLIT_X + BEVEL, WIRE_Y, pastSplit, TOP_Y);
  wire(SPLIT_X, SPLIT_X + BEVEL, WIRE_Y, pastSplit, BOT_Y);

  // Horizontal tracks
  wire(SPLIT_X + BEVEL, swQ.x - SW_GAP, TOP_Y, pastSplit);
  wire(SPLIT_X + BEVEL, swP.x - SW_GAP, BOT_Y, pastSplit);

  drawSwitch(swQ);
  drawSwitch(swP);

  wire(swQ.x + SW_GAP, JOIN_X - BEVEL, TOP_Y, pastQ || state.won);
  wire(swP.x + SW_GAP, JOIN_X - BEVEL, BOT_Y, pastP || state.won);

  // Angled connectors: tracks → join
  wire(JOIN_X - BEVEL, JOIN_X, TOP_Y, pastQ || state.won, WIRE_Y);
  wire(JOIN_X - BEVEL, JOIN_X, BOT_Y, pastP || state.won, WIRE_Y);

  // Main wire after join
  wire(JOIN_X, WIRE_END - 2, WIRE_Y, pastJoin || state.won);

  // Junction dots
  dot(SPLIT_X, WIRE_Y, pastSplit);
  dot(JOIN_X,  WIRE_Y, pastJoin || state.won);

  drawSource();
  drawBulb(state.won);

  // Ball(s) — interpolate Y along angled connectors
  if (!state.won && !state.dead) {
    if (phase === 'main' || phase === 'join') {
      drawBall(bx, WIRE_Y);
    } else if (phase === 'split') {
      drawBall(bx, TOP_Y); drawBall(bx, BOT_Y);
    } else if (phase === 'splitting') {
      const t = (bx - SPLIT_X) / BEVEL;
      drawBall(bx, WIRE_Y + t * (TOP_Y - WIRE_Y));
      drawBall(bx, WIRE_Y + t * (BOT_Y - WIRE_Y));
    } else if (phase === 'joining') {
      const t = (bx - (JOIN_X - BEVEL)) / BEVEL;
      drawBall(bx, TOP_Y + t * (WIRE_Y - TOP_Y));
      drawBall(bx, BOT_Y + t * (WIRE_Y - BOT_Y));
    }
  }

  drawKeyIndicator('Q', 20, 28);
  drawKeyIndicator('P', 20, 50);
}

// ── MAIN DRAW ──────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#08080f'; ctx.fillRect(0, 0, W, H);

  if (state.type === 'custom') drawCustom();
  else if (state.type === 'single') drawLevel1();
  else drawLevel2();

  if (state.type !== 'custom') {
    if (state.won)  drawOverlay('CIRCUIT COMPLET !', '#ffff44', '#ffff00');
    if (state.dead) drawOverlay('COURT-CIRCUIT !',   '#ff4444', '#ff0000');
  }

  if (state.waiting && !replayMode) drawWaiting();

  if (replayMode) {
    ctx.save();
    ctx.font = 'bold 13px Courier New';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ff4444';
    ctx.shadowBlur = 8; ctx.shadowColor = '#ff0000';
    ctx.fillText('● REPLAY', W - 16, 24);
    ctx.restore();
  }
}

// ── CUSTOM LEVEL HELPERS ───────────────────────────────────

// Returns flat [x0,y0,x1,y1,...] array for an edge
function edgePolyline(edge, nodes) {
  const from = nodes.find(n => n.id === edge.from);
  const to   = nodes.find(n => n.id === edge.to);
  if (!from || !to) return [];
  if (edge.wayY == null) {
    return [from.x, from.y, to.x, to.y];
  }
  const wy = edge.wayY;
  const dyfrom = Math.abs(wy - from.y);
  const dyto   = Math.abs(wy - to.y);
  const dirX   = Math.sign(to.x - from.x) || 1;
  const xmid1  = from.x + Math.min(dyfrom, BEVEL) * dirX;
  const xmid2  = to.x   - Math.min(dyto,   BEVEL) * dirX;
  return [
    from.x, from.y,
    xmid1, wy,
    xmid2, wy,
    to.x, to.y
  ];
}

// Total length of a flat polyline array [x0,y0,x1,y1,...]
function polylineLength(pts) {
  let len = 0;
  for (let i = 0; i < pts.length - 2; i += 2) {
    const dx = pts[i+2] - pts[i], dy = pts[i+3] - pts[i+1];
    len += Math.sqrt(dx*dx + dy*dy);
  }
  return len;
}

// Returns {x, y} at progress t (0..1) along a flat polyline
function posOnEdge(t, edge, nodes) {
  const pts = edgePolyline(edge, nodes);
  if (pts.length < 4) return { x: 0, y: 0 };
  const total = polylineLength(pts);
  let dist = t * total;
  for (let i = 0; i < pts.length - 2; i += 2) {
    const dx = pts[i+2] - pts[i], dy = pts[i+3] - pts[i+1];
    const segLen = Math.sqrt(dx*dx + dy*dy);
    if (dist <= segLen || i >= pts.length - 4) {
      const tt = segLen > 0 ? Math.min(dist / segLen, 1) : 0;
      return { x: pts[i] + tt * dx, y: pts[i+1] + tt * dy };
    }
    dist -= segLen;
  }
  return { x: pts[pts.length-2], y: pts[pts.length-1] };
}

// Build game state from JSON level descriptor
// Resistance constants
const RES_HALF      = 50;   // half-length of the resistance zone on the wire
const RES_DRAIN     = 0.025; // speed lost per frame inside resistance
const RES_BOOST     = 0.35;  // speed gained per spacebar press
const RES_SPEED_MAX = BALL_SPEED;
const RES_SPEED_MIN = 0;
const MICRO_HALF    = 32;   // half-length of the microprocessor zone on the wire

function makeCustomLevel(json) {
  const nodes = json.nodes.map(n => ({ id: n.id, type: n.type, x: n.x, y: n.y }));
  const edges = json.edges.map(e => ({
    id: e.id, from: e.from, to: e.to,
    wayY: e.wayY ?? null,
    switch: e.switch ? { key: e.switch.key, initOpen: e.switch.initOpen } : null,
    resistance: e.resistance === true,
    resDuration: e.resDuration ?? 3,
    micro: e.micro === true,
    microDuration: e.microDuration ?? 5
  }));

  // Build switch map
  const switchMap = new Map();
  for (const e of edges) {
    if (e.switch) {
      switchMap.set(e.id, {
        key: e.switch.key,
        initOpen: e.switch.initOpen,
        open: e.switch.initOpen
      });
    }
  }

  const resistanceSet = new Set(edges.filter(e => e.resistance).map(e => e.id));
  // resDurationMap : edgeId → durée en secondes pour traverser la zone
  const resistanceDrain = new Map(
    edges.filter(e => e.resistance).map(e => [e.id, e.resDuration ?? 3])
  );

  const microSet = new Set(edges.filter(e => e.micro).map(e => e.id));
  const microDurationMap = new Map(
    edges.filter(e => e.micro).map(e => [e.id, e.microDuration ?? 5])
  );

  // Find source node(s) — start balls from outgoing edges of each source
  const balls = [];
  for (const node of nodes) {
    if (node.type === 'source') {
      const outgoing = edges.filter(e => e.from === node.id);
      for (const e of outgoing) {
        balls.push({ edgeId: e.id, t: 0, x: node.x, y: node.y, speed: BALL_SPEED, gauge: 1.0 });
      }
    }
  }

  return {
    type: 'custom',
    graph: { nodes, edges },
    switchMap,
    resistanceSet,
    resistanceDrain,
    microSet,
    microDurationMap,
    microChallenge: null,
    balls,
    edgesLit: new Set(),
    joinWait: new Map(),
    arrived: 0,
    won: false,
    dead: false,
    waiting: true,
    ballSpeedMult: json.ballSpeedMult ?? 1.0,
    _name: json.name || 'Custom'
  };
}

// ── CUSTOM UPDATE ──────────────────────────────────────────
function updateCustom(dt) {
  const st = state;
  if (st.won || st.dead) return;
  const { graph, switchMap, resistanceSet, resistanceDrain, microSet, microDurationMap, balls, edgesLit, joinWait } = st;
  const levelSpeed = BALL_SPEED * (st.ballSpeedMult ?? 1.0);

  const { nodes, edges } = graph;

  // Update switch states
  for (const [eid, sw] of switchMap) {
    const wasOpen = sw.open;
    sw.open = sw.initOpen !== !!keys[sw.key];
    if (sw.open !== wasOpen) {
      if (!sw.open) sfxSwitchClose();
      else          sfxSwitchOpen();
    }
  }

  // Consume spacebar presses for resistance this frame
  const spaceThisFrame = spacePressCount;
  spacePressCount = 0;

  const toRemove = [];
  const toAdd = [];

  for (let bi = 0; bi < balls.length; bi++) {
    const ball = balls[bi];
    const edge = edges.find(e => e.id === ball.edgeId);
    if (!edge) { toRemove.push(bi); continue; }

    const len = polylineLength(edgePolyline(edge, nodes));

    // Resistance logic
    if (resistanceSet.has(edge.id)) {
      const tEntry = len > 0 ? Math.max(0, (len / 2 - RES_HALF) / len) : 0.5;
      const tExit  = len > 0 ? Math.min(1, (len / 2 + RES_HALF) / len) : 0.5;
      const inZone = ball.t >= tEntry && ball.t <= tExit;
      if (inZone) {
        const duration = (resistanceDrain && resistanceDrain.get(edge.id)) ?? 3;
        // Vitesse fixe : la boule met exactement `duration` secondes à traverser la zone
        ball.speed = (2 * RES_HALF) / duration;
        // Jauge : démarre pleine, se vide en `duration` secondes sans input
        // ~3 pressions/s suffisent pour la maintenir (indépendant de la durée)
        const drainPerSec = 1.0; // jauge se vide en 1s sans input, quelle que soit la durée
        const boostPerPress = drainPerSec / 3; // ~3 pressions/s pour maintenir
        ball.gauge = Math.min(1.0, ball.gauge + spaceThisFrame * boostPerPress);
        ball.gauge = Math.max(0, ball.gauge - drainPerSec * dt);
        if (spaceThisFrame > 0) sfxSpark();
        else if (Math.random() < 0.25) sfxResistance();
        if (ball.gauge <= 0) { st.dead = true; sfxDead(); return; }
      } else {
        ball.speed = Math.min(levelSpeed, ball.speed + levelSpeed * 3 * dt);
      }
    } else {
      ball.speed = levelSpeed;
    }

    // Microprocesseur : fige la balle au centre et déclenche le défi
    if (microSet && microSet.has(edge.id)) {
      const mc = st.microChallenge;
      if (!mc && !ball.microSolved && ball.t >= 0.5) {
        ball.t = 0.5;
        const dur = microDurationMap.get(edge.id) ?? 5;
        const code = [Math.floor(Math.random()*10), Math.floor(Math.random()*10), Math.floor(Math.random()*10)];
        st.microChallenge = { edgeId: edge.id, code, entered: [], timeLeft: dur, maxTime: dur, ballRef: ball };
        sfxSwitchOpen();
      }
      if (st.microChallenge && st.microChallenge.edgeId === edge.id) {
        ball.speed = 0;
        ball.t = 0.5;
      }
    }

    const step = len > 0 ? ball.speed * dt / len : 0;
    const prevT = ball.t;
    ball.t += step;

    // Check switch: mort si ouvert et boule dans la zone (continu)
    const sw = switchMap.get(edge.id);
    if (sw) {
      const swLen   = polylineLength(edgePolyline(edge, nodes));
      const tEntry  = swLen > 0 ? Math.max(0, (swLen / 2 - SW_GAP) / swLen) : 0.5;
      const tExit   = swLen > 0 ? Math.min(1, (swLen / 2 + SW_GAP) / swLen) : 0.5;
      const tCenter = 0.5;
      const inSwZone = ball.t >= tEntry && ball.t <= tExit;
      if (sw.open && inSwZone) {
        st.dead = true; sfxDead(); return;
      }
      if (!sw.open && prevT < tCenter && ball.t >= tCenter) {
        sfxSpark();
      }
    }

    if (ball.t >= 1) {
      ball.t = 1;
      toRemove.push(bi);

      // Mark edge lit
      edgesLit.add(edge.id);

      const toNode = nodes.find(n => n.id === edge.to);
      if (!toNode) continue;

      if (toNode.type === 'bulb') {
        st.arrived++;
        // don't spawn more balls

      } else {
        const outEdges = edges.filter(e => e.from === toNode.id);
        const inEdges  = edges.filter(e => e.to   === toNode.id);

        if (outEdges.length === 0) {
          // dead end — nothing
        } else if (outEdges.length === 1) {
          const outE = outEdges[0];
          // Check if this is a join node (2+ incoming edges)
          if (inEdges.length >= 2) {
            // join logic: wait for all incoming to arrive
            const waited = (joinWait.get(toNode.id) || 0) + 1;
            joinWait.set(toNode.id, waited);
            if (waited >= inEdges.length) {
              joinWait.delete(toNode.id);
              sfxJoin();
              toAdd.push({ edgeId: outE.id, t: 0, x: toNode.x, y: toNode.y, speed: levelSpeed, gauge: 1.0 });
            }
          } else {
            toAdd.push({ edgeId: outE.id, t: 0, x: toNode.x, y: toNode.y, speed: levelSpeed, gauge: 1.0 });
          }
        } else {
          // Split: spawn a ball on each outgoing edge
          sfxSplit();
          for (const outE of outEdges) {
            toAdd.push({ edgeId: outE.id, t: 0, x: toNode.x, y: toNode.y, speed: levelSpeed, gauge: 1.0 });
          }
        }
      }
    } else {
      // Update ball position
      const pos = posOnEdge(ball.t, edge, nodes);
      ball.x = pos.x; ball.y = pos.y;
    }
  }

  // Décompte du défi microprocesseur
  if (st.microChallenge) {
    st.microChallenge.timeLeft -= dt;
    if (st.microChallenge.timeLeft <= 0) { st.dead = true; sfxDead(); return; }
  }

  // Remove finished balls (in reverse order)
  for (let i = toRemove.length - 1; i >= 0; i--) balls.splice(toRemove[i], 1);
  for (const b of toAdd) balls.push(b);

  // Update positions for new balls
  for (const ball of balls) {
    if (ball.x === undefined || toAdd.includes(ball)) {
      const edge = edges.find(e => e.id === ball.edgeId);
      if (edge) {
        const pos = posOnEdge(ball.t, edge, nodes);
        ball.x = pos.x; ball.y = pos.y;
      }
    }
  }

  // Win check
  if (balls.length === 0 && st.arrived > 0 && !st.won && !st.dead) {
    st.won = true;
    sfxWin();
  }
}

// ── DRAW RESISTANCE SYMBOL ─────────────────────────────────
function drawResistance(edge, nodes, ballInside, ballSpeed) {
  const sp  = posOnEdge(0.5,  edge, nodes);
  const sp1 = posOnEdge(0.48, edge, nodes);
  const sp2 = posOnEdge(0.52, edge, nodes);
  const angle = Math.atan2(sp2.y - sp1.y, sp2.x - sp1.x);

  const energyRatio = ballInside ? Math.max(0, ballSpeed) : 1; // ballSpeed est déjà 0..1 (gauge)
  const hue     = Math.round(energyRatio * 110); // 110=green → 0=red
  const col     = ballInside ? `hsl(${hue},100%,55%)` : '#cc8800';
  const colDim  = ballInside ? `hsl(${hue},60%,18%)`  : '#2a1a00';
  const glowCol = ballInside ? col : '#664400';

  const RW = RES_HALF - 4; // body half-width along wire axis
  const RH = 13;            // body half-height perpendicular

  ctx.save();
  ctx.translate(sp.x, sp.y);
  ctx.rotate(angle);

  // Connector stubs (wire endpoints touching body)
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.shadowBlur = 8; ctx.shadowColor = col;
  ctx.beginPath(); ctx.moveTo(-RES_HALF, 0); ctx.lineTo(-RW, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( RW, 0);       ctx.lineTo( RES_HALF, 0); ctx.stroke();
  ctx.restore();

  // Body fill
  ctx.save();
  ctx.shadowBlur = ballInside ? 22 : 8; ctx.shadowColor = glowCol;
  ctx.fillStyle = colDim;
  ctx.fillRect(-RW, -RH, RW * 2, RH * 2);
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.strokeRect(-RW, -RH, RW * 2, RH * 2);
  ctx.restore();

  // Resistor bands (4 colored stripes) — clipped to body
  const bandColors = ['#ff3333', '#ff8800', '#ffee00', '#4488ff'];
  const nBands = bandColors.length;
  const bandW  = 6;
  const spacing = (RW * 2 - nBands * bandW) / (nBands + 1);
  ctx.save();
  ctx.beginPath(); ctx.rect(-RW + 1, -RH + 1, RW * 2 - 2, RH * 2 - 2); ctx.clip();
  for (let i = 0; i < nBands; i++) {
    const bx = -RW + spacing * (i + 1) + bandW * i;
    ctx.fillStyle = ballInside ? bandColors[i] : '#443300';
    ctx.globalAlpha = ballInside ? 0.85 : 0.5;
    ctx.fillRect(bx, -RH, bandW, RH * 2);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Label (aligné avec le fil, toujours à l'endroit)
  ctx.save();
  // Si le fil pointe vers la gauche, retourner le texte de 180°
  if (angle > Math.PI / 2 || angle < -Math.PI / 2) ctx.rotate(Math.PI);
  ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center';
  ctx.fillStyle = col; ctx.shadowBlur = ballInside ? 6 : 0; ctx.shadowColor = col;
  ctx.fillText(ballInside ? '[ ESPACE ]' : 'résistance', 0, RH + 14);
  ctx.restore();

  // Energy gauge bar (alignée avec le fil)
  if (ballInside) {
    const bw = RW * 2, bh = 5, by = RH + 7;
    ctx.fillStyle = '#1a0800';
    ctx.fillRect(-bw / 2, by, bw, bh);
    ctx.fillStyle = col;
    ctx.shadowBlur = 10; ctx.shadowColor = col;
    ctx.fillRect(-bw / 2, by, bw * energyRatio, bh);
    ctx.strokeStyle = '#554400'; ctx.lineWidth = 1; ctx.shadowBlur = 0;
    ctx.strokeRect(-bw / 2, by, bw, bh);
  }

  ctx.restore();
}

// ── DRAW MICROPROCESSOR SYMBOL ─────────────────────────────
function drawMicroprocessor(edge, nodes, active) {
  const sp  = posOnEdge(0.5,  edge, nodes);
  const sp1 = posOnEdge(0.48, edge, nodes);
  const sp2 = posOnEdge(0.52, edge, nodes);
  const angle = Math.atan2(sp2.y - sp1.y, sp2.x - sp1.x);

  const MW = 26, MH = 18;
  const col   = active ? '#00aaff' : '#2255aa';
  const colBg = active ? '#001428' : '#00080f';
  const glow  = active ? '#0088ff' : '#112244';

  ctx.save();
  ctx.translate(sp.x, sp.y);
  ctx.rotate(angle);

  // Stubs de connexion
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.shadowBlur = active ? 10 : 4; ctx.shadowColor = glow;
  ctx.beginPath(); ctx.moveTo(-MICRO_HALF, 0); ctx.lineTo(-MW, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(MW, 0);           ctx.lineTo(MICRO_HALF, 0); ctx.stroke();
  ctx.restore();

  // Corps du chip
  ctx.save();
  ctx.shadowBlur = active ? 22 : 6; ctx.shadowColor = glow;
  ctx.fillStyle = colBg;
  ctx.fillRect(-MW, -MH, MW*2, MH*2);
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.strokeRect(-MW, -MH, MW*2, MH*2);
  ctx.restore();

  // Picots (3 par côté)
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  ctx.shadowBlur = 0;
  for (let i = 0; i < 3; i++) {
    const py = -MH + MH * (2*(i+1)/4);
    ctx.beginPath(); ctx.moveTo(-MW, py); ctx.lineTo(-MW-7, py); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( MW, py); ctx.lineTo( MW+7, py); ctx.stroke();
  }
  ctx.restore();

  // Label μP
  ctx.save();
  if (angle > Math.PI/2 || angle < -Math.PI/2) ctx.rotate(Math.PI);
  ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = col;
  ctx.shadowBlur = active ? 8 : 0; ctx.shadowColor = col;
  ctx.fillText('μP', 0, 0);
  ctx.restore();

  ctx.restore();
}

// ── DRAW MICRO CHALLENGE OVERLAY ───────────────────────────
function drawMicroOverlay(mc) {
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const dW = 52, dGap = 10;
  const totalCodeW = 3 * dW + 2 * dGap;
  const boxW = Math.max(totalCodeW + 40, 240);
  const boxH = 130;
  const bx = cx - boxW/2, by = cy - boxH/2;

  // Fond
  ctx.save();
  ctx.fillStyle = 'rgba(0,10,28,0.93)';
  ctx.fillRect(bx - 8, by - 8, boxW + 16, boxH + 16);
  ctx.strokeStyle = '#0077dd';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 18; ctx.shadowColor = '#0055cc';
  ctx.strokeRect(bx - 8, by - 8, boxW + 16, boxH + 16);
  ctx.restore();

  // Titre
  ctx.save();
  ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
  ctx.fillStyle = '#3399ff'; ctx.shadowBlur = 6; ctx.shadowColor = '#0055cc';
  ctx.fillText('— MICROPROCESSEUR —', cx, by + 6);
  ctx.restore();

  // Code à taper (chiffres en boîtes)
  const startX = cx - totalCodeW/2;
  const codeY  = by + 22;
  for (let i = 0; i < 3; i++) {
    const dx = startX + i * (dW + dGap);
    ctx.save();
    ctx.fillStyle = '#001830'; ctx.strokeStyle = '#0077dd'; ctx.lineWidth = 1.5;
    ctx.fillRect(dx, codeY, dW, 34);
    ctx.strokeRect(dx, codeY, dW, 34);
    ctx.font = 'bold 22px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#00ccff'; ctx.shadowBlur = 8; ctx.shadowColor = '#00aaff';
    ctx.fillText(mc.code[i], dx + dW/2, codeY + 17);
    ctx.restore();
  }

  // Ligne "tape ↓"
  ctx.save();
  ctx.font = '11px Courier New'; ctx.textAlign = 'center';
  ctx.fillStyle = '#224466';
  ctx.fillText('▼  tape le code  ▼', cx, codeY + 44);
  ctx.restore();

  // Cases de saisie
  const entY = codeY + 54;
  for (let i = 0; i < 3; i++) {
    const dx = startX + i * (dW + dGap);
    const d = mc.entered[i];
    const filled = d !== undefined;
    ctx.save();
    ctx.fillStyle = filled ? '#002a00' : '#001010';
    ctx.strokeStyle = filled ? '#00ff88' : '#113322';
    ctx.lineWidth = 1.5;
    ctx.fillRect(dx, entY, dW, 34);
    ctx.strokeRect(dx, entY, dW, 34);
    if (filled) {
      ctx.font = 'bold 22px Courier New'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#00ff88'; ctx.shadowBlur = 8; ctx.shadowColor = '#00ff88';
      ctx.fillText(d, dx + dW/2, entY + 17);
    }
    ctx.restore();
  }

  // Barre de timer
  const ratio = Math.max(0, mc.timeLeft / mc.maxTime);
  const hue   = Math.round(ratio * 110);
  const barY  = by + boxH - 2;
  const barW  = boxW;
  ctx.save();
  ctx.fillStyle = '#0a1020';
  ctx.fillRect(bx, barY, barW, 8);
  ctx.fillStyle = `hsl(${hue},100%,50%)`;
  ctx.shadowBlur = 8; ctx.shadowColor = `hsl(${hue},100%,50%)`;
  ctx.fillRect(bx, barY, barW * ratio, 8);
  ctx.strokeStyle = '#1a2030'; ctx.lineWidth = 1; ctx.shadowBlur = 0;
  ctx.strokeRect(bx, barY, barW, 8);
  ctx.restore();

  // Texte timer
  ctx.save();
  ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'right';
  ctx.fillStyle = `hsl(${hue},100%,65%)`;
  ctx.fillText(mc.timeLeft.toFixed(1) + 's', bx + barW, barY - 3);
  ctx.restore();
}

// ── CUSTOM DRAW ────────────────────────────────────────────
function drawCustom() {
  const st = state;
  const { graph, switchMap, resistanceSet, microSet, microChallenge, balls, edgesLit } = st;
  const { nodes, edges } = graph;

  // Apply fit transform so entire level is visible
  ctx.save();
  ctx.setTransform(camScale, 0, 0, camScale, camTX, camTY);

  const edgesWithBall = new Set(balls.map(b => b.edgeId));

  const drawPolylinePts = (pts, col, w, gl) => {
    if (!pts || pts.length < 4) return;
    ctx.save();
    if (gl) { ctx.shadowBlur = gl; ctx.shadowColor = col; }
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i+1]);
    ctx.stroke(); ctx.restore();
  };

  // Draw edges
  for (const edge of edges) {
    // Fully lit only when completed; active ball edge stays dim until traversed
    const fullyLit = edgesLit.has(edge.id);
    const dimColor = '#1a4035';
    const litColor = '#00ffcc';
    const sw      = switchMap.get(edge.id);
    const hasRes  = resistanceSet && resistanceSet.has(edge.id);
    const hasMicro = microSet && microSet.has(edge.id);
    const gapHalf = sw ? SW_GAP : (hasRes ? RES_HALF : (hasMicro ? MICRO_HALF : 0));

    // Helper: draw one segment, split around obstacle gap if needed
    const drawSegment = (tFrom, tTo, col, w, gl) => {
      if (tTo <= tFrom) return;
      if (gapHalf > 0) {
        const total = polylineLength(edgePolyline(edge, nodes));
        const tLeft  = total > 0 ? Math.max(0, (total / 2 - gapHalf) / total) : 0.5;
        const tRight = total > 0 ? Math.min(1, (total / 2 + gapHalf) / total) : 0.5;
        // left of gap
        if (tFrom < tLeft)
          drawPolylinePts(edgePolylineBetween(edge, nodes, tFrom, Math.min(tTo, tLeft)), col, w, gl);
        // right of gap
        if (tTo > tRight)
          drawPolylinePts(edgePolylineBetween(edge, nodes, Math.max(tFrom, tRight), tTo), col, w, gl);
      } else {
        drawPolylinePts(edgePolylineBetween(edge, nodes, tFrom, tTo), col, w, gl);
      }
    };

    const ball = balls.find(b => b.edgeId === edge.id);

    if (fullyLit) {
      // Entire edge lit
      drawSegment(0, 1, litColor, 3, 12);
    } else if (ball) {
      // Dim base wire
      drawSegment(0, 1, dimColor, 2, 0);
      // Lit trail behind the ball (from 0 to ball.t)
      if (ball.t > 0)
        drawSegment(0, ball.t, litColor, 3, 12);
    } else {
      // No ball, not completed → fully dim
      drawSegment(0, 1, dimColor, 2, 0);
    }

    // Draw resistance
    if (resistanceSet && resistanceSet.has(edge.id)) {
      const ball = balls.find(b => b.edgeId === edge.id);
      const len2 = polylineLength(edgePolyline(edge, nodes));
      const tEntry = len2 > 0 ? Math.max(0, (len2 / 2 - RES_HALF) / len2) : 0.5;
      const tExit  = len2 > 0 ? Math.min(1, (len2 / 2 + RES_HALF) / len2) : 0.5;
      const inside = ball && ball.t >= tEntry && ball.t <= tExit;
      drawResistance(edge, nodes, inside, inside ? ball.gauge : 1.0);
    }

    // Draw microprocessor
    if (hasMicro) {
      const active = microChallenge && microChallenge.edgeId === edge.id;
      drawMicroprocessor(edge, nodes, active);
    }

    // Draw switch — aligned to wire direction
    if (sw) {
      const sp  = posOnEdge(0.5, edge, nodes);
      const sp1 = posOnEdge(0.48, edge, nodes);
      const sp2 = posOnEdge(0.52, edge, nodes);
      const angle = Math.atan2(sp2.y - sp1.y, sp2.x - sp1.x);
      const c = keyColor(sw.key);
      const g = SW_GAP;

      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.rotate(angle);

      // Terminals
      ctx.save();
      ctx.shadowBlur = 8; ctx.shadowColor = c.main; ctx.fillStyle = c.main;
      ctx.beginPath(); ctx.arc(-g, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc( g, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      if (!sw.open) {
        // Closed: lever along wire axis
        ctx.save();
        ctx.strokeStyle = c.main; ctx.lineWidth = 3;
        ctx.shadowBlur = 14; ctx.shadowColor = c.main;
        ctx.beginPath(); ctx.moveTo(-g, 0); ctx.lineTo(g, 0); ctx.stroke();
        ctx.restore();
      } else {
        // Open: lever rotated ~50° away from wire axis
        ctx.save();
        ctx.strokeStyle = c.main; ctx.lineWidth = 2.5;
        ctx.shadowBlur = 8; ctx.shadowColor = c.glow;
        ctx.beginPath();
        ctx.moveTo(-g, 0);
        ctx.lineTo(g * 0.4 * Math.cos(-1.0) * 2, g * 0.4 * Math.sin(-1.0) * 2 - 18);
        ctx.stroke();
        ctx.restore();
      }

      // Label: perpendicular to wire, offset to the side
      ctx.save();
      ctx.rotate(-angle); // unrotate for readable text
      ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
      ctx.fillStyle = c.main;
      ctx.shadowBlur = sw.open ? 0 : 6; ctx.shadowColor = c.glow;
      ctx.fillText('[' + sw.key + ']', 0, 44);
      ctx.restore();

      ctx.restore(); // undo translate+rotate
    }
  }

  // Draw nodes
  for (const node of nodes) {
    if (node.type === 'source') {
      drawSource(node.x, node.y);
    } else if (node.type === 'bulb') {
      // Check if this bulb has been arrived at
      const inEdges = edges.filter(e => e.to === node.id);
      const bulbLit = st.won || inEdges.some(e => edgesLit.has(e.id));
      drawBulb(bulbLit, node.x, node.y);
    } else {
      // junction nodes are invisible in play mode
    }
  }

  // Draw balls
  for (const ball of balls) {
    drawBall(ball.x, ball.y);
  }

  ctx.restore(); // end camera transform — UI draws in screen space

  // Key indicators for keys used in this level
  const usedKeys = [...new Set([...switchMap.values()].map(sw => sw.key))];
  usedKeys.forEach((k, i) => drawKeyIndicator(k, 20, 28 + i * 22));

  // Space indicator if level has resistances
  if (resistanceSet && resistanceSet.size > 0) {
    const hasRes = balls.some(b => {
      const edge = edges.find(e => e.id === b.edgeId);
      if (!edge || !resistanceSet.has(edge.id)) return false;
      const l = polylineLength(edgePolyline(edge, nodes));
      const tE = l > 0 ? Math.max(0, (l / 2 - RES_HALF) / l) : 0.5;
      const tX = l > 0 ? Math.min(1, (l / 2 + RES_HALF) / l) : 0.5;
      return b.t >= tE && b.t <= tX;
    });
    const py = 28 + usedKeys.length * 22;
    ctx.save();
    ctx.font = 'bold 14px Courier New'; ctx.textAlign = 'left';
    ctx.fillStyle = hasRes ? '#ff8800' : '#3a2000';
    ctx.shadowBlur = hasRes ? 10 : 0; ctx.shadowColor = '#ff6600';
    ctx.fillText('ESPACE  ' + (hasRes ? '█ SPAM !' : '░'), 20, py);
    ctx.restore();
  }

  // Micro challenge overlay (espace écran, hors transform caméra)
  if (microChallenge && !st.dead && !st.won) drawMicroOverlay(microChallenge);

  // Overlays
  if (st.won)  drawOverlay('CIRCUIT COMPLET !', '#ffff44', '#ffff00');
  if (st.dead) drawOverlay('COURT-CIRCUIT !',   '#ff4444', '#ff0000');
}

// Helper: returns flat polyline points between two t parameters
function edgePolylineBetween(edge, nodes, tFrom, tTo) {
  const pts = edgePolyline(edge, nodes);
  if (pts.length < 4) return [];
  const total = polylineLength(pts);
  if (total === 0) return [];
  const dFrom = tFrom * total;
  const dTo   = tTo   * total;
  const result = [];
  let walked = 0;
  for (let i = 0; i < pts.length - 2; i += 2) {
    const dx = pts[i+2] - pts[i], dy = pts[i+3] - pts[i+1];
    const segLen = Math.sqrt(dx*dx + dy*dy);
    const segEnd = walked + segLen;
    if (segEnd <= dFrom) { walked = segEnd; continue; }
    if (walked >= dTo) break;
    const t0 = segLen > 0 ? Math.max(0, (dFrom - walked) / segLen) : 0;
    const t1 = segLen > 0 ? Math.min(1, (dTo   - walked) / segLen) : 1;
    if (result.length === 0) result.push(pts[i] + t0 * dx, pts[i+1] + t0 * dy);
    result.push(pts[i] + t1 * dx, pts[i+1] + t1 * dy);
    walked = segEnd;
  }
  return result;
}

// Helper: returns flat polyline points from start up to parameter t
function edgePolylineTo(edge, nodes, t) {
  const pts = edgePolyline(edge, nodes);
  if (pts.length < 4) return pts;
  const total = polylineLength(pts);
  const dist  = t * total;
  const result = [pts[0], pts[1]];
  let walked = 0;
  for (let i = 0; i < pts.length - 2; i += 2) {
    const dx = pts[i+2] - pts[i], dy = pts[i+3] - pts[i+1];
    const segLen = Math.sqrt(dx*dx + dy*dy);
    if (walked + segLen >= dist) {
      const tt = segLen > 0 ? (dist - walked) / segLen : 0;
      result.push(pts[i] + tt * dx, pts[i+1] + tt * dy);
      break;
    }
    walked += segLen;
    result.push(pts[i+2], pts[i+3]);
  }
  return result;
}

// Helper: returns flat polyline points from parameter t to end
function edgePolylineFrom(edge, nodes, t) {
  const pts = edgePolyline(edge, nodes);
  if (pts.length < 4) return pts;
  const total = polylineLength(pts);
  const dist  = t * total;
  const result = [];
  let walked = 0;
  for (let i = 0; i < pts.length - 2; i += 2) {
    const dx = pts[i+2] - pts[i], dy = pts[i+3] - pts[i+1];
    const segLen = Math.sqrt(dx*dx + dy*dy);
    if (result.length === 0 && walked + segLen >= dist) {
      const tt = segLen > 0 ? (dist - walked) / segLen : 0;
      result.push(pts[i] + tt * dx, pts[i+1] + tt * dy);
    }
    if (result.length > 0) result.push(pts[i+2], pts[i+3]);
    walked += segLen;
  }
  return result;
}

// ── LOOP ───────────────────────────────────────────────────
let lastTimestamp = 0;
function loop(timestamp) {
  const dt = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, 0.05) : 1 / 60;
  lastTimestamp = timestamp;
  if (replayMode) updateReplay();
  const wasWon  = state.won;
  const wasDead = state.dead;
  update(dt);
  if (!wasDead && state.dead && !replayMode) registerDeath();
  if (!wasWon && state.won && !replayMode) {
    stopRecordingWin();
    const nlWrap    = document.getElementById('next-level-wrap');
    const nlBtn     = document.getElementById('next-level-btn');
    const submitBtn = document.getElementById('submit-level-btn');

    // Bouton campagne
    const cp = campaignPos();
    nlBtn.style.display = cp >= 0 ? '' : 'none';
    if (cp >= 0) {
      if (cp + 1 < CAMPAIGN.length) {
        nlBtn.textContent = 'NIVEAU SUIVANT →';
        nlBtn.onclick = () => { nlWrap.style.display = 'none'; goNextCampaign(cp + 1); };
      } else {
        nlBtn.textContent = '🗂 CHOISIR UN NIVEAU';
        nlBtn.onclick = () => { nlWrap.style.display = 'none'; openMenu(); };
      }
    }

    // Bouton submit (mode test uniquement)
    if (isTestMode) {
      submitBtn.style.display = '';
      submitBtn.onclick = openSubmitOverlay;
    } else {
      submitBtn.style.display = 'none';
    }

    if (cp >= 0 || isTestMode) nlWrap.style.display = 'block';
  }
  draw();
  requestAnimationFrame(loop);
}

canvas.focus();

if (new URLSearchParams(location.search).has('test')) {
  const saved = localStorage.getItem('elecgame_test_level');
  if (saved) {
    try {
      const json = JSON.parse(saved);
      const customLv = {
        name: json.name || 'Test',
        hint: 'Niveau custom — [R] pour recommencer',
        _json: json,
        make: function() { return makeCustomLevel(this._json); }

      LEVELS.push(customLv);
      const btn = document.createElement('button');
      btn.className = 'lvl-btn';
      btn.textContent = customLv.name;
      const idx = LEVELS.length - 1;
      btn.onclick = () => selectLevel(idx);
      // Insert before the load button
      lsDiv.insertBefore(btn, btnLoadExt);
      selectLevel(idx);
    } catch(e) {
      console.error('Could not load test level', e);
    }
  }
}

// ── FILE LOAD BUTTON ────────────────────────────────────────
document.getElementById('btn-load-ext').addEventListener('click', () => {
  document.getElementById('ext-level-input').click();
});

document.getElementById('ext-level-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const json = JSON.parse(ev.target.result);
      const customLv = {
        name: json.name || file.name.replace('.json', ''),
        hint: (json.name || 'Niveau custom') + ' — [R] pour recommencer',
        _json: json,
        make: function() { return makeCustomLevel(this._json); }
      };
      LEVELS.push(customLv);
      const btn = document.createElement('button');
      btn.className = 'lvl-btn';
      btn.textContent = customLv.name;
      const idx = LEVELS.length - 1;
      btn.onclick = () => selectLevel(idx);
      lsDiv.insertBefore(btn, btnLoadExt);
      selectLevel(idx);
    } catch(err) {
      alert('Fichier JSON invalide');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ── REPLAY FILE LOADER ──────────────────────────────────────
document.getElementById('replay-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const json = JSON.parse(ev.target.result);
      if (!json.inputs || !Array.isArray(json.inputs)) throw new Error('invalid');
      loadReplayFile(json);
    } catch(err) {
      alert('Fichier replay invalide');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ── SIDEBAR ────────────────────────────────────────────────
const sidebar        = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebar-overlay');

function openMenu() {
  sidebar.classList.add('open');
  sidebarOverlay.classList.add('visible');
}
function closeMenu() {
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('visible');
}

document.getElementById('menu-btn').addEventListener('click', openMenu);
document.getElementById('sidebar-close').addEventListener('click', closeMenu);
sidebarOverlay.addEventListener('click', closeMenu);

// Close sidebar when a level button is clicked
lsDiv.addEventListener('click', e => {
  if (e.target.classList.contains('lvl-btn')) closeMenu();
});

// ── TOUCH CONTROLS ─────────────────────────────────────────
let spaceHoldInterval = null;

function setupTouchBtn(id, keyName, opts = {}) {
  const btn = document.getElementById(id);
  if (!btn) return;

  function press(e) {
    e.preventDefault();
    resumeAudio();
    btn.classList.add('pressed');
    if (opts.isRestart) {
      selectLevel(currentLevel);
      return;
    }
    if (opts.isSpace) {
      spacePressCount++;
      if (!replayMode) recordKey('keydown', ' ');
      if (!spaceHoldInterval) {
        spaceHoldInterval = setInterval(() => {
          spacePressCount++;
          if (!replayMode) recordKey('keydown', ' ');
        }, 180);
      }
    } else {
      if (!replayMode) { keys[keyName] = true; recordKey('keydown', keyName); }
    }
    if (!humOsc) startHum();
  }

  function release(e) {
    e.preventDefault();
    btn.classList.remove('pressed');
    if (opts.isRestart) return;
    if (opts.isSpace) {
      clearInterval(spaceHoldInterval);
      spaceHoldInterval = null;
      if (!replayMode) recordKey('keyup', ' ');
    } else {
      if (!replayMode) { keys[keyName] = false; recordKey('keyup', keyName); }
    }
  }

  btn.addEventListener('touchstart',  press,   { passive: false });
  btn.addEventListener('touchend',    release, { passive: false });
  btn.addEventListener('touchcancel', release, { passive: false });
  // Also mouse for desktop testing
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup',   release);
  btn.addEventListener('mouseleave',release);
}

setupTouchBtn('btn-q',       'Q');
setupTouchBtn('btn-p',       'P');
setupTouchBtn('btn-space',   ' ', { isSpace: true });
setupTouchBtn('btn-restart', null, { isRestart: true });

if (!new URLSearchParams(location.search).has('test')) selectLevel(0);
loop();
