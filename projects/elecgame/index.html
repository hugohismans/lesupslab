<html lang="fr">
<head>

<title>Die and Relight</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #06060e;
  color: #00ffcc;
  font-family: 'Courier New', monospace;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  user-select: none;
}

/* ── OVERLAYS ─────────────────────────────────────────────── */
#scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,0.07) 3px,
    rgba(0,0,0,0.07) 4px
  );
}
#vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99;
  background: radial-gradient(ellipse at center,
    transparent 40%,
    rgba(0,0,0,0.55) 100%
  );
}

/* ── SIDE PANELS ─────────────────────────────────────────── */
.side-panel {
  width: 250px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 24px 16px 16px;
  gap: 10px;
  z-index: 1;
  overflow: hidden;
}
#panel-left  { border-right: 1px solid #1a4535; background: linear-gradient(90deg, transparent, #03120e); }
#panel-right { border-left:  1px solid #1a4535; background: linear-gradient(270deg, transparent, #03120e); }
.panel-header {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
  padding-bottom: 8px;
  border-bottom: 1px solid #1a4535;
}
.panel-title {
  font-size: 12px;
  letter-spacing: 3px;
  color: #00cc99;
  text-transform: uppercase;
  text-shadow: 0 0 8px #00ffcc55;
}
.hof-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.hof-tab {
  font-size: 10px;
  letter-spacing: 1px;
  font-family: 'Courier New', monospace;
  padding: 2px 8px;
  border: 1px solid #1a4535;
  background: transparent;
  color: #446655;
  cursor: pointer;
  transition: all 0.15s;
}
.hof-tab.active { border-color: #00cc99; color: #00ffcc; background: #00ffcc11; text-shadow: 0 0 6px #00ffcc88; }
.hof-tab:hover:not(.active) { border-color: #2a6655; color: #669977; }

.panel-body {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-thumb { background: #1a5a3a; border-radius: 2px; }

/* Special Thanks */
.sp-entry { padding: 7px 4px; border-bottom: 1px solid #0d2a1a; }
.sp-pseudo { color: #cc66ff; font-size: 13px; letter-spacing: 1px; text-shadow: 0 0 8px #cc44ff44; }
.sp-level  { font-size: 10px; letter-spacing: 1px; margin-top: 2px; }

/* HOF rows */
.ihof-row { display: flex; align-items: baseline; gap: 6px; padding: 6px 4px; border-bottom: 1px solid #0d2a1a; }
.ihof-rank   { font-size: 14px; flex-shrink: 0; width: 24px; }
.ihof-pseudo { color: #00ddbb; font-size: 12px; letter-spacing: 1px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ihof-time   { color: #558866; font-size: 11px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.ihof-deaths { color: #994444; font-size: 11px; flex-shrink: 0; }
.ihof-1st .ihof-pseudo { color: #ffdd44; text-shadow: 0 0 8px #ffdd4466; }
.ihof-2nd .ihof-pseudo { color: #cccccc; }
.ihof-3rd .ihof-pseudo { color: #ee9944; }
.panel-empty { color: #336644; font-size: 11px; letter-spacing: 1px; padding: 10px 4px; line-height: 1.6; }

@media (max-width: 820px) { .side-panel { display: none; } }

/* ── CENTER ──────────────────────────────────────────────── */
#center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
}

canvas#bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

#content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 36px;
}

/* ── TITLE ───────────────────────────────────────────────── */
#title-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

#title-icon {
  font-size: 28px;
  opacity: 0.7;
  letter-spacing: 0;
  animation: icon-pulse 4s ease-in-out infinite;
  margin-bottom: 2px;
}
@keyframes icon-pulse {
  0%, 100% { filter: drop-shadow(0 0 4px #00ffcc88); opacity: 0.6; }
  50%       { filter: drop-shadow(0 0 14px #00ffcccc); opacity: 1; }
}

#title {
  font-size: 52px;
  font-weight: bold;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: #00ffcc;
  text-shadow: 0 0 20px #00ffcc, 0 0 60px #00ffcc66, 0 0 120px #00ffcc22;
  animation: pulse 3s ease-in-out infinite;
  position: relative;
}
@keyframes pulse {
  0%, 100% { text-shadow: 0 0 20px #00ffcc, 0 0 60px #00ffcc44; }
  50%       { text-shadow: 0 0 30px #00ffcc, 0 0 80px #00ffcc88, 0 0 140px #00ffcc33; }
}

/* Glitch layers */
#title::before,
#title::after {
  content: attr(data-text);
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  overflow: hidden;
  opacity: 0;
}
#title::before {
  color: #ff0044;
  animation: glitch-top 7s infinite;
  clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
}
#title::after {
  color: #00ffcc;
  animation: glitch-bot 7s infinite;
  clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
}
@keyframes glitch-top {
  0%, 90%, 100% { opacity: 0; transform: none; }
  91%           { opacity: 0.7; transform: translateX(-4px); }
  92%           { opacity: 0.7; transform: translateX(4px); }
  93%           { opacity: 0; }
  95%           { opacity: 0.5; transform: translateX(-2px); }
  96%           { opacity: 0; }
}
@keyframes glitch-bot {
  0%, 90%, 100% { opacity: 0; transform: none; }
  91%           { opacity: 0.5; transform: translateX(4px); }
  92%           { opacity: 0.5; transform: translateX(-4px); }
  93%           { opacity: 0; }
  95%           { opacity: 0.3; transform: translateX(2px); }
  96%           { opacity: 0; }
}

#subtitle {
  font-size: 12px;
  letter-spacing: 6px;
  color: #1a5a3a;
  text-transform: uppercase;
  opacity: 0;
  animation: subtitle-in 1s ease 0.8s forwards;
}
@keyframes subtitle-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* ── KEYS ────────────────────────────────────────────────── */
#keys {
  display: flex;
  gap: 24px;
  align-items: center;
}

.key-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.key-box {
  width: 52px;
  height: 52px;
  border: 2px solid currentColor;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
  position: relative;
  transition: all 0.15s;
  cursor: default;
}
.key-box::after {
  content: '';
  position: absolute;
  inset: 0;
  background: currentColor;
  opacity: 0;
  transition: opacity 0.1s;
}
.key-box.pressed::after { opacity: 0.15; }
.key-box.pressed { transform: translateY(2px); box-shadow: 0 0 24px currentColor !important; }

.key-box.q { color: #ffaa00; box-shadow: 0 0 12px #ffaa0033; }
.key-box.p { color: #cc44ff; box-shadow: 0 0 12px #cc44ff33; }
.key-box.space {
  width: 120px;
  height: 52px;
  color: #aaaaaa;
  border-color: #aaaaaa;
  box-shadow: 0 0 8px #aaaaaa22;
}

.key-desc {
  font-size: 10px;
  letter-spacing: 2px;
  color: #1a5a3a;
  text-align: center;
  text-transform: uppercase;
  max-width: 110px;
  line-height: 1.4;
}

.key-sep { color: #1a4035; font-size: 20px; padding-bottom: 20px; }

/* ── PLAY BUTTON ─────────────────────────────────────────── */
#play-btn {
  background: transparent;
  border: 2px solid #00ffcc;
  color: #00ffcc;
  font-family: 'Courier New', monospace;
  font-size: 18px;
  letter-spacing: 6px;
  text-transform: uppercase;
  padding: 18px 70px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: color 0.2s, box-shadow 0.2s;
  animation: btn-breathe 2.8s ease-in-out infinite;
}
@keyframes btn-breathe {
  0%, 100% { box-shadow: 0 0 16px #00ffcc33, inset 0 0 0px #00ffcc00; }
  50%       { box-shadow: 0 0 40px #00ffcc66, inset 0 0 12px #00ffcc11; }
}
#play-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: #00ffcc;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.25s ease;
  z-index: -1;
}
#play-btn:hover { color: #06060e; animation: none; box-shadow: 0 0 50px #00ffccaa; }
#play-btn:hover::before { transform: scaleX(1); }
#play-btn:active { transform: scale(0.97); }

/* ── EDITOR LINK ─────────────────────────────────────────── */
#editor-link {
  font-size: 12px;
  color: #00cc99;
  letter-spacing: 3px;
  text-decoration: none;
  text-transform: uppercase;
  transition: color 0.2s, text-shadow 0.2s, border-color 0.2s;
  margin-top: -10px;
  text-shadow: 0 0 8px #00cc9933;
  border: 1px solid #1a5a3a;
  padding: 7px 20px;
}
#editor-link:hover { color: #00ffcc; text-shadow: 0 0 14px #00ffcc88; border-color: #00cc99; }

/* ── VERSION BADGE ───────────────────────────────────────── */
#version-badge {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 101;
  font-size: 10px;
  letter-spacing: 3px;
  color: #1a3a2a;
  text-transform: uppercase;
  pointer-events: none;
}
</style>

<script src="special_thanks.js"></script>
<script>
// ── BACKGROUND : CIRCUIT BOARD ─────────────────────────────
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildGrid();
}

// Grid
let nodes = [], hSegs = [], vSegs = [], electrons = [];
const CELL_W = 130, CELL_H = 100;

function buildGrid() {
  nodes = []; hSegs = []; vSegs = []; electrons = [];
  const cols = Math.ceil(W / CELL_W) + 2;
  const rows = Math.ceil(H / CELL_H) + 2;
  const ox = -CELL_W;
  const oy = -CELL_H;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      nodes.push({ x: ox + c * CELL_W, y: oy + r * CELL_H, r, c });
    }
  }

  const cols_ = cols;
  // Horizontal segments (~55% of possible)
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols - 1; c++) {
      if (Math.random() < 0.55) {
        const a = nodes[r * cols_ + c];
        const b = nodes[r * cols_ + c + 1];
        hSegs.push({ a, b, lit: false, litT: 0 });
      }
    }
  }
  // Vertical segments (~40%)
  for (let r = 0; r < rows - 1; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() < 0.40) {
        const a = nodes[r * cols_ + c];
        const b = nodes[(r + 1) * cols_ + c];
        vSegs.push({ a, b, lit: false, litT: 0 });
      }
    }
  }

  // Spawn electrons
  const allSegs = [...hSegs, ...vSegs];
  for (let i = 0; i < 10; i++) spawnElectron(allSegs);
}

function spawnElectron(allSegs) {
  const pool = allSegs || [...hSegs, ...vSegs];
  if (!pool.length) return;
  const seg = pool[Math.floor(Math.random() * pool.length)];
  const dir = Math.random() < 0.5 ? 1 : -1;
  electrons.push({
    seg,
    t: dir > 0 ? 0 : 1,
    dir,
    speed: 0.0025 + Math.random() * 0.004,
    alpha: 0.7 + Math.random() * 0.3,
  });
}

let lastTime = 0;
function drawBg(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  ctx.clearRect(0, 0, W, H);

  const allSegs = [...hSegs, ...vSegs];

  // Randomly light up segments
  for (const seg of allSegs) {
    if (!seg.lit && Math.random() < 0.0008) { seg.lit = true; seg.litT = 0; }
    if (seg.lit) {
      seg.litT += dt;
      if (seg.litT > 1.5) { seg.lit = false; seg.litT = 0; }
    }
  }

  // Draw dim segments
  ctx.strokeStyle = '#0d2a1e';
  ctx.lineWidth = 1;
  for (const seg of allSegs) {
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(seg.a.x, seg.a.y);
    ctx.lineTo(seg.b.x, seg.b.y);
    ctx.stroke();
  }

  // Draw lit segments
  for (const seg of allSegs) {
    if (!seg.lit) continue;
    const fade = Math.sin(seg.litT * Math.PI / 1.5);
    ctx.globalAlpha = fade * 0.5;
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#00ffcc';
    ctx.beginPath();
    ctx.moveTo(seg.a.x, seg.a.y);
    ctx.lineTo(seg.b.x, seg.b.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // Draw nodes
  for (const nd of nodes) {
    // only draw nodes that have at least one adjacent lit segment (perf)
    ctx.fillStyle = '#0d2a1e';
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(nd.x, nd.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Update & draw electrons
  for (let i = electrons.length - 1; i >= 0; i--) {
    const el = electrons[i];
    el.t += el.dir * el.speed;

    if (el.t < 0 || el.t > 1) {
      // Respawn
      const pool = allSegs;
      if (pool.length) {
        const seg = pool[Math.floor(Math.random() * pool.length)];
        el.seg = seg;
        el.t = el.dir > 0 ? 0 : 1;
        el.speed = 0.0025 + Math.random() * 0.004;
      }
      continue;
    }

    // Mark segment as lit when electron passes
    el.seg.lit = true;
    el.seg.litT = 0;

    const x = el.seg.a.x + (el.seg.b.x - el.seg.a.x) * el.t;
    const y = el.seg.a.y + (el.seg.b.y - el.seg.a.y) * el.t;

    // Glow
    const grad = ctx.createRadialGradient(x, y, 0, x, y, 8);
    grad.addColorStop(0, `rgba(0,255,204,${el.alpha * 0.9})`);
    grad.addColorStop(1, 'rgba(0,255,204,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fill();

    // Core dot
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = el.alpha;
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(drawBg);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(drawBg);

// ── KEY DEMO ANIMATION ─────────────────────────────────────
function pressKey(el, delay) {
  setTimeout(() => {
    el.classList.add('pressed');
    setTimeout(() => el.classList.remove('pressed'), 200);
  }, delay);
}
setTimeout(() => {
  pressKey(document.getElementById('key-q'),     100);
  pressKey(document.getElementById('key-p'),     500);
  pressKey(document.getElementById('key-space'), 900);
}, 1800);

// ── AUDIO ──────────────────────────────────────────────────
let AC = null;

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  startAmbient();
}

function startAmbient() {
  const osc = AC.createOscillator();
  const g   = AC.createGain();
  osc.type = 'sawtooth'; osc.frequency.value = 60;
  g.gain.setValueAtTime(0.001, AC.currentTime);
  g.gain.linearRampToValueAtTime(0.008, AC.currentTime + 2);
  osc.connect(g); g.connect(AC.destination);
  osc.start();
  scheduleRandomCrackle();
}

function scheduleRandomCrackle() {
  const delay = 1500 + Math.random() * 4000;
  setTimeout(() => {
    if (!AC) return;
    playCrackle(0.03 + Math.random() * 0.05);
    scheduleRandomCrackle();
  }, delay);
}

function playCrackle(vol) {
  const buf = AC.createBuffer(1, AC.sampleRate * 0.06, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = AC.createBufferSource();
  src.buffer = buf;
  const filt = AC.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = 2000 + Math.random() * 3000; filt.Q.value = 2;
  const g = AC.createGain();
  g.gain.value = vol;
  src.connect(filt); filt.connect(g); g.connect(AC.destination);
  src.start();
}

function playButtonSound() {
  if (!AC) return;
  const osc = AC.createOscillator();
  const g   = AC.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, AC.currentTime);
  osc.frequency.exponentialRampToValueAtTime(880, AC.currentTime + 0.18);
  g.gain.setValueAtTime(0.15, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.3);
  osc.connect(g); g.connect(AC.destination);
  osc.start(); osc.stop(AC.currentTime + 0.31);
  setTimeout(() => playCrackle(0.12), 80);
}

document.addEventListener('mousemove', initAudio, { once: true });
document.addEventListener('keydown',   initAudio, { once: true });

document.querySelectorAll('.key-box').forEach(box => {
  box.addEventListener('mouseenter', () => { initAudio(); if (AC) playCrackle(0.06); });
});

// ── START GAME ─────────────────────────────────────────────
function startGame() {
  initAudio();
  playButtonSound();
  setTimeout(() => { window.location.href = 'game.html'; }, 320);
}

// ── SIDE PANELS ────────────────────────────────────────────
const HOF_VERSIONS = ['v0_0_3', 'v0_0_2', 'v0_0_1'];
const FB_URL = 'https://dieandretry-af391-default-rtdb.europe-west1.firebasedatabase.app/hof';
let hofCurrentVersion = HOF_VERSIONS[0];

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function renderSpecials() {
  const el = document.getElementById('sp-list');
  if (!SPECIAL_THANKS.length) { el.innerHTML = '<div class="panel-empty">—</div>'; return; }
  el.innerHTML = SPECIAL_THANKS.map(s =>
    `<div class="sp-entry">
      <div class="sp-pseudo">${escHtml(s.pseudo)}</div>
      <div class="sp-level" style="color:${specialThanksColor(s.level)}">${escHtml(s.level || '')}</div>
    </div>`
  ).join('');
}

function buildHofTabs() {
  const tabs = document.getElementById('hof-tabs');
  if (HOF_VERSIONS.length <= 1) {
    tabs.innerHTML = `<span class="hof-tab active">${HOF_VERSIONS[0].replace(/_/g,'.')}</span>`;
    return;
  }
  tabs.innerHTML = HOF_VERSIONS.map(v =>
    `<button class="hof-tab${v === hofCurrentVersion ? ' active' : ''}" onclick="switchHofVersion('${v}')">${v.replace(/_/g,'.')}</button>`
  ).join('');
}

function switchHofVersion(v) {
  hofCurrentVersion = v;
  buildHofTabs();
  renderHOF();
}

async function renderHOF() {
  const el = document.getElementById('ihof-list');
  el.innerHTML = '<div class="panel-empty">Chargement…</div>';
  try {
    const res = await fetch(`${FB_URL}/${hofCurrentVersion}.json`);
    const data = res.ok ? await res.json() : null;
    const entries = data
      ? Object.values(data).sort((a, b) => a.time - b.time).slice(0, 20)
      : [];
    if (!entries.length) {
      el.innerHTML = '<div class="panel-empty">Pas encore d\'entrée —<br>sois le premier !</div>';
      return;
    }
    const medals = ['🥇','🥈','🥉'];
    const cls    = ['ihof-1st','ihof-2nd','ihof-3rd'];
    el.innerHTML = entries.map((e, i) =>
      `<div class="ihof-row ${cls[i]||''}">
        <span class="ihof-rank">${medals[i]||(i+1)}</span>
        <span class="ihof-pseudo">${escHtml(e.pseudo)}</span>
        <span class="ihof-time">${fmtTime(e.time)}</span>
        <span class="ihof-deaths">${e.deaths}💀</span>
      </div>`
    ).join('');
  } catch {
    el.innerHTML = '<div class="panel-empty">Erreur de chargement</div>';
  }
}

renderSpecials();
buildHofTabs();
renderHOF();
</script>
</body>
</html>
