<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Die and Relight</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #06060e;
  color: #00ffcc;
  font-family: 'Courier New', monospace;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  user-select: none;
}

/* ── SIDE PANELS ─────────────────────────────────────────── */
.side-panel {
  width: 250px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 24px 16px 16px;
  gap: 10px;
  z-index: 1;
  overflow: hidden;
}
#panel-left  { border-right: 1px solid #1a4535; background: linear-gradient(90deg, transparent, #03120e); }
#panel-right { border-left:  1px solid #1a4535; background: linear-gradient(270deg, transparent, #03120e); }
.panel-header {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
  padding-bottom: 8px;
  border-bottom: 1px solid #1a4535;
}
.panel-title {
  font-size: 12px;
  letter-spacing: 3px;
  color: #00cc99;
  text-transform: uppercase;
  text-shadow: 0 0 8px #00ffcc55;
}
/* Version tabs */
.hof-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.hof-tab {
  font-size: 10px;
  letter-spacing: 1px;
  font-family: 'Courier New', monospace;
  padding: 2px 8px;
  border: 1px solid #1a4535;
  background: transparent;
  color: #446655;
  cursor: pointer;
  transition: all 0.15s;
}
.hof-tab.active {
  border-color: #00cc99;
  color: #00ffcc;
  background: #00ffcc11;
  text-shadow: 0 0 6px #00ffcc88;
}
.hof-tab:hover:not(.active) { border-color: #2a6655; color: #669977; }

.panel-body {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-thumb { background: #1a5a3a; border-radius: 2px; }

/* Special Thanks */
.sp-entry { padding: 7px 4px; border-bottom: 1px solid #0d2a1a; }
.sp-entry:first-child { border-top: none; }
.sp-pseudo { color: #cc66ff; font-size: 13px; letter-spacing: 1px; text-shadow: 0 0 8px #cc44ff44; }
.sp-level  { color: #448855; font-size: 10px; letter-spacing: 1px; margin-top: 2px; }

/* HOF rows */
.ihof-row { display: flex; align-items: baseline; gap: 6px; padding: 6px 4px; border-bottom: 1px solid #0d2a1a; }
.ihof-rank   { font-size: 14px; flex-shrink: 0; width: 24px; }
.ihof-pseudo { color: #00ddbb; font-size: 12px; letter-spacing: 1px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ihof-time   { color: #558866; font-size: 11px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.ihof-deaths { color: #994444; font-size: 11px; flex-shrink: 0; }
.ihof-1st .ihof-pseudo { color: #ffdd44; text-shadow: 0 0 8px #ffdd4466; }
.ihof-2nd .ihof-pseudo { color: #cccccc; }
.ihof-3rd .ihof-pseudo { color: #ee9944; }
.panel-empty { color: #336644; font-size: 11px; letter-spacing: 1px; padding: 10px 4px; line-height: 1.6; }

@media (max-width: 820px) { .side-panel { display: none; } }

/* ── CENTER ──────────────────────────────────────────────── */
#center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

canvas#bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

#content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
}

#center { z-index: 1; }

#title-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

#title {
  font-size: 52px;
  font-weight: bold;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: #00ffcc;
  text-shadow:
    0 0 20px #00ffcc,
    0 0 60px #00ffcc66,
    0 0 120px #00ffcc22;
  animation: pulse 3s ease-in-out infinite;
}

#subtitle {
  font-size: 13px;
  letter-spacing: 5px;
  color: #224433;
  text-transform: uppercase;
}

@keyframes pulse {
  0%, 100% { text-shadow: 0 0 20px #00ffcc, 0 0 60px #00ffcc44; }
  50%       { text-shadow: 0 0 30px #00ffcc, 0 0 80px #00ffcc88, 0 0 140px #00ffcc33; }
}

#keys {
  display: flex;
  gap: 24px;
  align-items: center;
}

.key-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.key-box {
  width: 52px;
  height: 52px;
  border: 2px solid currentColor;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 0;
  position: relative;
  transition: all 0.2s;
}

.key-box.q { color: #ffaa00; box-shadow: 0 0 12px #ffaa0055; }
.key-box.p { color: #cc44ff; box-shadow: 0 0 12px #cc44ff55; }
.key-box.space {
  width: 120px;
  height: 52px;
  color: #aaaaaa;
  border-color: #aaaaaa;
  box-shadow: 0 0 8px #aaaaaa33;
}

.key-desc {
  font-size: 10px;
  letter-spacing: 2px;
  color: #224433;
  text-align: center;
  text-transform: uppercase;
  max-width: 100px;
}

.key-sep {
  color: #1a4035;
  font-size: 20px;
  padding-bottom: 20px;
}

#play-btn {
  background: transparent;
  border: 2px solid #00ffcc;
  color: #00ffcc;
  font-family: 'Courier New', monospace;
  font-size: 18px;
  letter-spacing: 5px;
  text-transform: uppercase;
  padding: 16px 60px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.2s;
  box-shadow: 0 0 20px #00ffcc33;
}

#play-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: #00ffcc;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.25s ease;
  z-index: -1;
}

#play-btn:hover {
  color: #06060e;
  box-shadow: 0 0 40px #00ffcc88;
}
#play-btn:hover::before { transform: scaleX(1); }

#play-btn:active { transform: scale(0.97); }

#editor-link {
  font-size: 11px;
  color: #1a4035;
  letter-spacing: 2px;
  text-decoration: none;
  text-transform: uppercase;
  transition: color 0.2s;
  margin-top: -20px;
}
#editor-link:hover { color: #446655; }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- Left: Special Thanks -->
<div class="side-panel" id="panel-left">
  <div class="panel-header">
    <div class="panel-title">✦ Special Thanks</div>
  </div>
  <div class="panel-body" id="sp-list"></div>
</div>

<!-- Center -->
<div id="center">
  <div id="content">
    <div id="title-wrap">
      <div id="title">Die and Relight</div>
      <div id="subtitle">un jeu de circuit électrique</div>
    </div>

    <div id="keys">
      <div class="key-item">
        <div class="key-box q">Q</div>
        <div class="key-desc">Interrupteur gauche</div>
      </div>
      <div class="key-sep">+</div>
      <div class="key-item">
        <div class="key-box p">P</div>
        <div class="key-desc">Interrupteur droit</div>
      </div>
      <div class="key-sep">+</div>
      <div class="key-item">
        <div class="key-box space">ESPACE</div>
        <div class="key-desc">Passer les résistances</div>
      </div>
    </div>

    <button id="play-btn" onclick="startGame()">Jouer maintenant</button>
    <a id="editor-link" href="editor.html">éditeur de niveaux →</a>
  </div>
</div>

<!-- Right: Hall of Fame -->
<div class="side-panel" id="panel-right">
  <div class="panel-header">
    <div class="panel-title">🏆 Hall of Fame</div>
    <div class="hof-tabs" id="hof-tabs"></div>
  </div>
  <div class="panel-body" id="ihof-list"></div>
</div>

<script>
// ── BACKGROUND ANIMATION ───────────────────────────────────
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Floating wire segments
const wires = Array.from({ length: 14 }, () => makeWire());

function makeWire() {
  const y = Math.random() * H;
  return {
    x: Math.random() * W,
    y,
    len: 80 + Math.random() * 200,
    speed: 0.3 + Math.random() * 0.5,
    alpha: 0.04 + Math.random() * 0.1,
    lit: Math.random() < 0.3,
    litProgress: Math.random(),
    litSpeed: 0.003 + Math.random() * 0.006,
    sparkT: -1,
  };
}

function drawBg() {
  ctx.clearRect(0, 0, W, H);

  for (const w of wires) {
    w.x += w.speed;
    if (w.x > W + w.len) { Object.assign(w, makeWire()); w.x = -w.len; }

    if (w.lit) {
      w.litProgress += w.litSpeed;
      if (w.litProgress > 1.2) { w.lit = false; w.litProgress = 0; }
    } else if (Math.random() < 0.002) {
      w.lit = true; w.litProgress = 0;
    }

    const p = Math.min(w.litProgress, 1);
    const litLen = w.len * p;

    ctx.save();
    ctx.globalAlpha = w.alpha;
    // Dim wire
    ctx.strokeStyle = '#1a4035'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x + w.len, w.y); ctx.stroke();
    // Lit portion
    if (w.lit && litLen > 0) {
      ctx.globalAlpha = w.alpha * 4;
      ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 1.5;
      ctx.shadowBlur = 8; ctx.shadowColor = '#00ffcc';
      ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x + litLen, w.y); ctx.stroke();
    }
    ctx.restore();
  }

  requestAnimationFrame(drawBg);
}
drawBg();

// ── AUDIO ──────────────────────────────────────────────────
let AC = null;

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  startAmbient();
}

function startAmbient() {
  // Low hum
  const osc = AC.createOscillator();
  const g   = AC.createGain();
  osc.type = 'sawtooth'; osc.frequency.value = 60;
  g.gain.setValueAtTime(0.001, AC.currentTime);
  g.gain.linearRampToValueAtTime(0.008, AC.currentTime + 2);
  osc.connect(g); g.connect(AC.destination);
  osc.start();

  // Occasional soft crackles
  scheduleRandomCrackle();
}

function scheduleRandomCrackle() {
  const delay = 1500 + Math.random() * 4000;
  setTimeout(() => {
    if (!AC) return;
    playCrackle(0.03 + Math.random() * 0.05);
    scheduleRandomCrackle();
  }, delay);
}

function playCrackle(vol) {
  const buf = AC.createBuffer(1, AC.sampleRate * 0.06, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = AC.createBufferSource();
  src.buffer = buf;
  const filt = AC.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = 2000 + Math.random() * 3000; filt.Q.value = 2;
  const g = AC.createGain();
  g.gain.value = vol;
  src.connect(filt); filt.connect(g); g.connect(AC.destination);
  src.start();
}

function playButtonSound() {
  if (!AC) return;
  // Rising tone
  const osc = AC.createOscillator();
  const g   = AC.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, AC.currentTime);
  osc.frequency.exponentialRampToValueAtTime(880, AC.currentTime + 0.18);
  g.gain.setValueAtTime(0.15, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.3);
  osc.connect(g); g.connect(AC.destination);
  osc.start(); osc.stop(AC.currentTime + 0.31);
  // Spark burst
  setTimeout(() => playCrackle(0.12), 80);
}

document.addEventListener('mousemove', initAudio, { once: true });
document.addEventListener('keydown',   initAudio, { once: true });

// ── KEY GLOW ON HOVER ──────────────────────────────────────
document.querySelectorAll('.key-box').forEach(box => {
  box.addEventListener('mouseenter', () => {
    initAudio();
    if (AC) playCrackle(0.06);
  });
});

// ── START GAME ─────────────────────────────────────────────
function startGame() {
  initAudio();
  playButtonSound();
  setTimeout(() => { window.location.href = 'game.html'; }, 320);
}

// ── SIDE PANELS ────────────────────────────────────────────
const HOF_VERSIONS = ['v0_0_1'];
const FB_URL = 'https://dieandretry-af391-default-rtdb.europe-west1.firebasedatabase.app/hof';
let hofCurrentVersion = HOF_VERSIONS[0];

// Special thanks / content creators — edit this list manually
const SPECIAL_THANKS = [
  { pseudo: 'Lesups', level: 'Créateur du jeu' },
  { pseudo: 'Hormun', level: 'Testeur' },
  { pseudo: 'Skunkz', level: 'Testeur' },
  { pseudo: 'Alex', level: 'Testeur' },
  { pseudo: 'AccurateCatFish', level: 'Testeur' },
  { pseudo: 'KetaKoala', level: 'Createur de niveau' },
];

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function renderSpecials() {
  const el = document.getElementById('sp-list');
  if (!SPECIAL_THANKS.length) { el.innerHTML = '<div class="panel-empty">—</div>'; return; }
  el.innerHTML = SPECIAL_THANKS.map(s =>
    `<div class="sp-entry">
      <div class="sp-pseudo">${escHtml(s.pseudo)}</div>
      <div class="sp-level">${escHtml(s.level || '')}</div>
    </div>`
  ).join('');
}

function buildHofTabs() {
  const tabs = document.getElementById('hof-tabs');
  if (HOF_VERSIONS.length <= 1) {
    // Show the single version as a non-clickable badge
    tabs.innerHTML = `<span class="hof-tab active">${HOF_VERSIONS[0].replace(/_/g,'.')}</span>`;
    return;
  }
  tabs.innerHTML = HOF_VERSIONS.map(v =>
    `<button class="hof-tab${v === hofCurrentVersion ? ' active' : ''}" onclick="switchHofVersion('${v}')">${v.replace(/_/g,'.')}</button>`
  ).join('');
}

function switchHofVersion(v) {
  hofCurrentVersion = v;
  buildHofTabs();
  renderHOF();
}

async function renderHOF() {
  const el = document.getElementById('ihof-list');
  el.innerHTML = '<div class="panel-empty">Chargement…</div>';
  try {
    const res = await fetch(`${FB_URL}/${hofCurrentVersion}.json`);
    const data = res.ok ? await res.json() : null;
    const entries = data
      ? Object.values(data).sort((a, b) => a.time - b.time).slice(0, 20)
      : [];
    if (!entries.length) {
      el.innerHTML = '<div class="panel-empty">Pas encore d\'entrée —<br>sois le premier !</div>';
      return;
    }
    const medals = ['🥇','🥈','🥉'];
    const cls    = ['ihof-1st','ihof-2nd','ihof-3rd'];
    el.innerHTML = entries.map((e, i) =>
      `<div class="ihof-row ${cls[i]||''}">
        <span class="ihof-rank">${medals[i]||(i+1)}</span>
        <span class="ihof-pseudo">${escHtml(e.pseudo)}</span>
        <span class="ihof-time">${fmtTime(e.time)}</span>
        <span class="ihof-deaths">${e.deaths}💀</span>
      </div>`
    ).join('');
  } catch {
    el.innerHTML = '<div class="panel-empty">Erreur de chargement</div>';
  }
}

renderSpecials();
buildHofTabs();
renderHOF();
</script>
</body>
</html>
