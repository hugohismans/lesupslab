<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPAS de Quaregnon — État des locaux</title>
  <link rel="stylesheet" href="css/public.css">
</head>
<body>

<header class="pub-header">
  <div class="pub-brand">
    <img src="assets/logo.jpg" alt="CPAS de Quaregnon" class="pub-logo">
    <div>
      <div class="pub-title">CPAS de Quaregnon</div>
      <div class="pub-subtitle">Disponibilité des locaux</div>
    </div>
  </div>
  <div class="pub-clock-wrap">
    <div class="pub-date" id="pubDate"></div>
    <div class="pub-clock" id="pubClock"></div>
  </div>
</header>

<div class="pub-message hidden" id="pubMessage">
  <span class="pub-msg-icon">📌</span>
  <div class="pub-msg-body">
    <span id="pubMsgText"></span>
    <span class="pub-msg-meta" id="pubMsgMeta"></span>
  </div>
</div>

<main class="pub-main" id="pubMain">
  <div class="pub-loading">Connexion en cours…</div>
</main>

<footer class="pub-footer">
  <span>Mise à jour en temps réel</span>
  <span id="pubLastUpdate"></span>
</footer>

<!-- Popup appel bénéficiaire -->
<div class="next-call-overlay hidden" id="nextCallOverlay">
  <div class="next-call-box">
    <div class="next-call-bell" id="nextCallBell">🔔</div>
    <div class="next-call-label" id="nextCallLabel">Bénéficiaire suivant</div>
    <div class="next-call-group hidden" id="nextCallGroup"></div>
    <div class="next-call-bureau" id="nextCallBureau"></div>
    <div class="next-call-hint" id="nextCallHint">Veuillez vous présenter au bureau</div>
    <div class="next-call-queue hidden" id="nextCallQueue"></div>
  </div>
</div>

<!-- Banner déverrouillage son (requis par les navigateurs) -->
<div class="sound-unlock hidden" id="soundUnlock">
  🔇 Cliquez n'importe où pour activer le son
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/holidays.js"></script>
<script>

// ── Helpers ───────────────────────────────────────────────────────
function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isoDateStr(d) { return isoDate(d); }

// ── Firebase ──────────────────────────────────────────────────────
firebase.initializeApp(CONFIG.FIREBASE);
const db = firebase.database();

let _reservations = {};
let _config = { agents: [], localLabels: {}, publicLabels: {}, agentColors: {}, agentEmojis: {}, agentPublicNames: {}, queueGroups: {}, features: {}, messageJour: '', messageJourAt: null, lieux: {} };
let _agentStatus = {};
let _currentLieuId = null;
let _locals = CONFIG.LOCALS;

function getLocalLabel(id)       { return _config.localLabels[id]  || `Local ${id}`; }
function getPublicLocalLabel(id) { return _config.publicLabels[id] || getLocalLabel(id); }
function getAgentColor(name) {
  const agent = _config.agents.find(a => a.name === name);
  if (!agent?.key) return null;
  return _config.agentColors[agent.key] || null;
}
function getQueueForLocal(localId) {
  return _prevQueue[localId] ?? _prevQueue[String(localId)] ?? 0;
}
function isLocalBusy(localId) {
  return getQueueForLocal(localId) >= 1;
}

function getAgentPublicName(name) {
  const agent = _config.agents.find(a => a.name === name);
  if (!agent?.key) return name;
  return _config.agentPublicNames[agent.key] || name;
}

function expandRec(id, res, viewStart, viewEnd) {
  if (res.isPermanent) return [{ id, ...res, _start: new Date(res.startDateTime), _end: null }];
  const origStart = new Date(res.startDateTime);
  const origEnd   = new Date(res.endDateTime);
  const dur = origEnd - origStart;
  if (!res.recurrence || res.recurrence.type === 'none') {
    if (origStart < viewEnd && origEnd > viewStart) return [{ id, ...res, _start: origStart, _end: origEnd }];
    return [];
  }
  const type = res.recurrence.type, interval = parseInt(res.recurrence.interval) || 1;
  const recEnd = res.recurrence.endDate ? new Date(res.recurrence.endDate + 'T23:59:59') : null;
  const exceptions = res.exceptions || {};
  const results = [];
  let cur = new Date(origStart);
  let guard = 0;
  while (cur < viewEnd && guard++ < 700) {
    if (recEnd && cur > recEnd) break;
    const end = new Date(cur.getTime() + dur);
    const occDate = isoDate(cur);
    const dow = cur.getDay();
    if (end > viewStart && !exceptions[occDate] && dow !== 0 && dow !== 6) {
      results.push({ id, ...res, _start: new Date(cur), _end: end });
    }
    if (type === 'daily')   cur.setDate(cur.getDate() + interval);
    else if (type === 'weekly')  cur.setDate(cur.getDate() + 7 * interval);
    else if (type === 'monthly') cur.setMonth(cur.getMonth() + interval);
  }
  return results;
}

function getOccs(now) {
  const dayS = new Date(now); dayS.setHours(0,0,0,0);
  const dayE = new Date(now); dayE.setHours(23,59,59,999);
  const result = [];
  Object.entries(_reservations).forEach(([id, res]) => {
    expandRec(id, res, dayS, dayE).forEach(o => result.push(o));
  });
  return result.filter(r => _locals.includes(parseInt(r.localId)));
}

// ── Horloge ───────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('pubClock').textContent = `${hh}:${mm}:${ss}`;
  const dateStr = now.toLocaleDateString('fr-BE', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  document.getElementById('pubDate').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
  const h = isBelgianHoliday(isoDate(now));
  document.body.classList.toggle('is-holiday', h);
}

// ── Rendu ─────────────────────────────────────────────────────────
function render() {
  const now  = new Date();
  const occs = getOccs(now);

  // Message du jour public
  const msg = _config.messageJourPublic;
  const msgEl = document.getElementById('pubMessage');
  if (msg) {
    document.getElementById('pubMsgText').textContent = msg;
    const metaEl = document.getElementById('pubMsgMeta');
    const at = _config.messageJourPublicAt;
    if (at) {
      const d = new Date(at);
      const dateStr = d.toLocaleDateString('fr-BE', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = d.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
      metaEl.textContent = `Mis à jour le ${dateStr} à ${timeStr}`;
    } else {
      metaEl.textContent = '';
    }
    msgEl.classList.remove('hidden');
  } else {
    msgEl.classList.add('hidden');
  }

  const main = document.getElementById('pubMain');
  const holidayName = isBelgianHoliday(isoDate(now)) ? getHolidayName(isoDate(now)) : '';

  if (holidayName) {
    main.innerHTML = `<div class="pub-holiday">
      <div class="pub-holiday-flag">🇧🇪</div>
      <div class="pub-holiday-name">${holidayName}</div>
      <div class="pub-holiday-sub">Le CPAS est fermé aujourd'hui</div>
    </div>`;
    return;
  }

  // ── Cartes de file de groupe ────────────────────────────────────
  const groupCards = Object.entries(_config.queueGroups || {}).map(([grpId, grp]) => {
    const lids     = (grp.localIds || []).map(Number).filter(l => _locals.includes(l));
    if (!lids.length) return '';
    const occupied = lids.filter(l => getQueueForLocal(l) >= 1).length;
    const overflow = _prevQueue[`wait_${grpId}`] ?? 0;
    const total    = lids.length;
    const waiting  = overflow; // personnes en attente au-delà de la capacité

    let statusHtml, cardClass;
    if (occupied === 0) {
      cardClass  = 'pub-grp-free';
      statusHtml = `<div class="pub-grp-status grp-free">Aucune attente</div>`;
    } else if (waiting > 0) {
      cardClass  = 'pub-grp-busy';
      statusHtml = `<div class="pub-grp-status grp-busy">${waiting} personne${waiting > 1 ? 's' : ''} en attente</div>`;
    } else {
      cardClass  = 'pub-grp-active';
      statusHtml = `<div class="pub-grp-status grp-active">${occupied} bureau${occupied > 1 ? 'x' : ''} en service</div>`;
    }

    const dots = lids.map(l => {
      const busy = getQueueForLocal(l) >= 1;
      return `<span class="pub-grp-dot${busy ? ' busy' : ''}"></span>`;
    }).join('');

    return `<div class="pub-grp-card ${cardClass}">
      <div class="pub-grp-name">🔗 ${grp.name}</div>
      ${statusHtml}
      <div class="pub-grp-dots">${dots}</div>
      <div class="pub-grp-cap">${occupied}/${total} bureaux</div>
    </div>`;
  }).join('');

  main.innerHTML = _locals.map(l => {
    const perm = occs.find(r => parseInt(r.localId) === l && r.isPermanent);
    const res  = occs.find(r => parseInt(r.localId) === l && !r.isPermanent && r._start <= now && r._end > now);
    const next = !perm && !res
      ? occs.filter(r => parseInt(r.localId) === l && !r.isPermanent && r._start > now)
             .sort((a,b) => a._start - b._start)[0]
      : null;
    const label = getPublicLocalLabel(l);

    if (perm) {
      const svc = perm.service === 'Autre' ? perm.serviceCustom : perm.service;
      const agt = perm.agent   === 'Autre' ? perm.agentCustom  : perm.agent;
      return `<div class="pub-card pub-perm">
        <div class="pub-card-label">${label}</div>
        <div class="pub-card-status">🔒 Permanent</div>
        <div class="pub-card-svc">${svc}</div>
        <div class="pub-card-agt">${getAgentPublicName(agt)}</div>
      </div>`;
    }

    if (res) {
      const svc   = res.service === 'Autre' ? res.serviceCustom : res.service;
      const agt   = res.agent   === 'Autre' ? res.agentCustom  : res.agent;
      const endH  = res._end.toLocaleTimeString('fr-BE', { hour:'2-digit', minute:'2-digit' });
      const color = getAgentColor(agt);
      const queue   = getQueueForLocal(l);
      const busy    = isLocalBusy(l);
      const waiting = Math.max(0, queue - 1);
      const cardClass  = busy ? 'pub-busy' : 'pub-free';
      const statusIcon = busy ? '🔴 Occupé' : '🟢 Disponible';
      return `<div class="pub-card ${cardClass}" style="${color ? `border-top:6px solid ${color}` : ''}">
        <div class="pub-card-label">${label}</div>
        <div class="pub-card-status">${statusIcon}</div>
        <div class="pub-card-svc">${svc}</div>
        <div class="pub-card-agt">${getAgentPublicName(agt)}</div>
        ${waiting > 0 ? `<div class="pub-card-until">${waiting} personne${waiting > 1 ? 's' : ''} en attente</div>` : ''}
      </div>`;
    }

    return `<div class="pub-card pub-closed">
      <div class="pub-card-label">${label}</div>
      <div class="pub-card-status">⚫ Fermé</div>
    </div>`;
  }).join('');

  // Injecter les cartes groupes en tête (si au moins un groupe actif)
  if (groupCards) main.innerHTML = groupCards + main.innerHTML;

  document.getElementById('pubLastUpdate').textContent =
    `Dernière mise à jour : ${now.toLocaleTimeString('fr-BE', { hour:'2-digit', minute:'2-digit' })}`;
}

// ── Init Firebase listeners ───────────────────────────────────────
db.ref('reservations').on('value', snap => {
  _reservations = snap.val() || {};
  render();
});

db.ref('appConfig').on('value', snap => {
  const d = snap.val() || {};
  _config.agents      = d.agents   ? Object.entries(d.agents).map(([k,v]) => ({key:k, name:v})) : [];
  _config.localLabels = d.localLabels || {};
  _config.agentColors = d.agentColors || {};
  _config.agentEmojis = d.agentEmojis || {};
  _config.features    = d.features    || {};
  _config.messageJour           = d.messageJour           || '';
  _config.messageJourAt         = d.messageJourAt         || null;
  _config.messageJourPublic     = d.messageJourPublic     || '';
  _config.messageJourPublicAt   = d.messageJourPublicAt   || null;
  _config.publicLabels      = d.publicLabels      || {};
  _config.agentPublicNames  = d.agentPublicNames  || {};
  _config.queueGroups       = d.queueGroups       || {};

  // Lieu — prendre le premier ou celui sauvegardé
  if (d.lieux) {
    const sorted = Object.entries(d.lieux)
      .map(([id, l]) => ({ id, name: l.name, order: l.order ?? 999, localIds: l.localIds ? Object.keys(l.localIds).map(Number) : [] }))
      .sort((a,b) => a.order - b.order);
    const saved = localStorage.getItem('cpas_currentLieu');
    const found = saved && sorted.find(l => l.id === saved);
    const active = found || sorted[0];
    if (active) { _currentLieuId = active.id; _locals = active.localIds; }
  }
  render();
});

db.ref(`agentStatus/${isoDate(new Date())}`).on('value', snap => {
  _agentStatus = snap.val() || {};
  render();
});

// ── Son (Web Audio API) ───────────────────────────────────────────
let _audioCtx = null;
let _audioReady = false;

function _ensureAudio() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
}

function playChime() {
  try {
    _ensureAudio();
    // Carillon ascendant : Do - Mi - Sol - Do (octave)
    [[523.25, 0], [659.25, 0.22], [783.99, 0.44], [1046.50, 0.66]].forEach(([freq, delay]) => {
      const osc  = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.connect(gain);
      gain.connect(_audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = _audioCtx.currentTime + delay;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.35, t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
      osc.start(t);
      osc.stop(t + 0.72);
    });
  } catch (e) { console.warn('Audio non disponible', e); }
}

// Déverrouillage son au premier clic (requis par les navigateurs)
document.addEventListener('click', () => {
  if (_audioReady) return;
  _ensureAudio();
  _audioReady = true;
  document.getElementById('soundUnlock').classList.add('hidden');
}, { once: false });

// Afficher le banner si le contexte est suspendu
window.addEventListener('load', () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') {
    document.getElementById('soundUnlock').classList.remove('hidden');
  }
  ctx.close();
});

// ── Popup "Bénéficiaire suivant" ─────────────────────────────────
let _prevQueue = {};
let _queueReady = false;
let _callDismissTimer = null;

function showNextCall(localId, agentName, groupName) {
  const bureauLabel = getPublicLocalLabel(localId);
  playChime();
  document.getElementById('nextCallBell').textContent   = '🔔';
  document.getElementById('nextCallLabel').textContent  = 'Bénéficiaire suivant';
  const grpEl = document.getElementById('nextCallGroup');
  if (groupName) {
    grpEl.textContent = groupName;
    grpEl.classList.remove('hidden');
  } else {
    grpEl.classList.add('hidden');
  }
  document.getElementById('nextCallBureau').textContent = bureauLabel;
  const hint = agentName
    ? `Veuillez vous présenter au bureau — vous serez reçu(e) par ${agentName}`
    : 'Veuillez vous présenter au bureau';
  document.getElementById('nextCallHint').textContent = hint;
  document.getElementById('nextCallQueue').classList.add('hidden');
  const overlay = document.getElementById('nextCallOverlay');
  overlay.classList.remove('hidden');
  if (_callDismissTimer) clearTimeout(_callDismissTimer);
  _callDismissTimer = setTimeout(() => overlay.classList.add('hidden'), 10000);
}

document.getElementById('nextCallOverlay').addEventListener('click', () => {
  document.getElementById('nextCallOverlay').classList.add('hidden');
  if (_callDismissTimer) clearTimeout(_callDismissTimer);
});

// Écoute Firebase — file d'attente (rendu uniquement, pas de popup)
db.ref(`queues/${isoDate(new Date())}`).on('value', snap => {
  _prevQueue  = snap.val() || {};
  _queueReady = true;
  render();
});

// Écoute Firebase — appel bénéficiaire (écrit par l'agent via "Je suis disponible")
let _lastCallTs = null;
db.ref('appState/lastCall').on('value', snap => {
  const d = snap.val();
  if (!d || !d.ts) return;
  if (_lastCallTs === null) { _lastCallTs = d.ts; return; } // ignorer valeur initiale
  if (d.ts === _lastCallTs) return;
  _lastCallTs = d.ts;
  if (_locals.includes(Number(d.localId))) {
    showNextCall(Number(d.localId), d.agentName || null, d.groupName || null);
  }
});

// Horloge chaque seconde
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
