<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>moncompagnon — État des locaux</title>
  <link rel="stylesheet" href="css/public.css">
</head>
<body>

<header class="pub-header">
  <div class="pub-brand">
    <img src="assets/logo.jpg" alt="Logo" class="pub-logo" id="pubLogo">
    <div>
      <div class="pub-title" id="pubOrgName">SiteCpas</div>
      <div class="pub-subtitle" id="pubSubtitle">Disponibilité des locaux</div>
    </div>
  </div>
  <div class="pub-clock-wrap">
    <div class="pub-date" id="pubDate"></div>
    <div class="pub-clock" id="pubClock"></div>
  </div>
</header>

<div class="pub-message hidden" id="pubMessage">
  <span class="pub-msg-icon">📌</span>
  <div class="pub-msg-body">
    <span id="pubMsgText"></span>
    <span class="pub-msg-meta" id="pubMsgMeta"></span>
  </div>
</div>

<main class="pub-main" id="pubMain">
  <div class="pub-loading">Connexion en cours…</div>
</main>

<footer class="pub-footer">
  <span>Mise à jour en temps réel</span>
  <span id="pubLastUpdate"></span>
</footer>

<!-- Popup appel bénéficiaire -->
<div class="next-call-overlay hidden" id="nextCallOverlay">
  <div class="next-call-box">
    <div class="next-call-bell" id="nextCallBell">🔔</div>
    <div class="next-call-label" id="nextCallLabel">Bénéficiaire suivant</div>
    <div class="next-call-ticket hidden" id="nextCallTicket"></div>
    <div class="next-call-name hidden" id="nextCallName"></div>
    <div class="next-call-group hidden" id="nextCallGroup"></div>
    <div class="next-call-bureau" id="nextCallBureau"></div>
    <div class="next-call-agent hidden" id="nextCallAgent"></div>
    <div class="next-call-hint" id="nextCallHint">Veuillez vous présenter au bureau</div>
    <div class="next-call-queue hidden" id="nextCallQueue"></div>
  </div>
</div>

<!-- Banner déverrouillage son (requis par les navigateurs) -->
<div class="sound-unlock hidden" id="soundUnlock">
  🔇 Cliquez n'importe où pour activer le son
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/holidays.js"></script>
<script>

// ── Helpers ───────────────────────────────────────────────────────
function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isoDateStr(d) { return isoDate(d); }

// ── Firebase ──────────────────────────────────────────────────────
firebase.initializeApp(CONFIG.FIREBASE);
const db = firebase.database();

// ── Paramètre écran ───────────────────────────────────────────────
// ?screen={id} → filtrer uniquement les locaux de cet écran
const _screenParam = new URLSearchParams(window.location.search).get('screen');

let _reservations = {};
let _config = { agents: [], localLabels: {}, publicLabels: {}, localDescriptions: {}, agentColors: {}, agentEmojis: {}, agentPublicNames: {}, queueGroups: {}, features: {}, screens: {}, messageJour: '', messageJourAt: null, lieux: {} };
let _agentStatus = {};
let _currentLieuId = null;
let _locals = CONFIG.LOCALS;
let _lastCallsData = {}; // dernier ticket appelé par local (pour affichage sur carte bureau)

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function getLocalLabel(id)       { return _config.localLabels[id]       || `Local ${id}`; }
function getPublicLocalLabel(id) { return _config.publicLabels[id]      || getLocalLabel(id); }
function getLocalDescription(id) { return _config.localDescriptions[id] || ''; }
function getAgentColor(name) {
  const agent = _config.agents.find(a => a.name === name);
  if (!agent?.key) return null;
  return _config.agentColors[agent.key] || null;
}
function getQueueForLocal(localId) {
  return _prevQueue[localId] ?? _prevQueue[String(localId)] ?? 0;
}
function isLocalBusy(localId) {
  return getQueueForLocal(localId) >= 1 || !!_bureauState[String(localId)]?.busyWithPreferred;
}

function getAgentPublicName(name) {
  const agent = _config.agents.find(a => a.name === name);
  if (!agent?.key) return name;
  return _config.agentPublicNames[agent.key] || name;
}
function getAgentPublicNameByKey(key) {
  const agent = _config.agents.find(a => a.key === key);
  if (!agent) return null;
  return _config.agentPublicNames[key] || agent.name;
}

const _tdDefaults = {
  publicCall:       { showNum: true,  showName: true  },
  publicBureauCard: { showNum: true,  showName: false },
  groupCard:        { showNum: true,  showName: true  },
};
function getTicketDisplay(loc) {
  const def    = _tdDefaults[loc] || { showNum: true, showName: true };
  const stored = _config.ticketDisplay[loc] || {};
  return { ...def, ...stored };
}
function getLocalQueueGroups(localId) {
  return Object.entries(_config.queueGroups || {})
    .filter(([, g]) => (g.localIds || []).map(Number).includes(Number(localId)))
    .map(([id, g]) => ({ id, ...g }));
}
function localQueueGroupsHtml(localId) {
  const grps = getLocalQueueGroups(localId);
  if (!grps.length) return null;
  return `<div class="pub-card-grp-badges">${grps.map(g => `<span class="pub-card-grp-badge">${escapeHtml(g.name)}</span>`).join('')}</div>`;
}

function expandRec(id, res, viewStart, viewEnd) {
  if (res.isPermanent) return [{ id, ...res, _start: new Date(res.startDateTime), _end: null }];
  const origStart = new Date(res.startDateTime);
  const origEnd   = new Date(res.endDateTime);
  const dur = origEnd - origStart;
  if (!res.recurrence || res.recurrence.type === 'none') {
    if (origStart < viewEnd && origEnd > viewStart) return [{ id, ...res, _start: origStart, _end: origEnd }];
    return [];
  }
  const type = res.recurrence.type, interval = parseInt(res.recurrence.interval) || 1;
  const recEnd = res.recurrence.endDate ? new Date(res.recurrence.endDate + 'T23:59:59') : null;
  const exceptions = res.exceptions || {};
  const results = [];
  let cur = new Date(origStart);
  let guard = 0;
  while (cur < viewEnd && guard++ < 700) {
    if (recEnd && cur > recEnd) break;
    const end = new Date(cur.getTime() + dur);
    const occDate = isoDate(cur);
    const dow = cur.getDay();
    if (end > viewStart && !exceptions[occDate] && dow !== 0 && dow !== 6) {
      results.push({ id, ...res, _start: new Date(cur), _end: end });
    }
    if (type === 'daily')   cur.setDate(cur.getDate() + interval);
    else if (type === 'weekly')  cur.setDate(cur.getDate() + 7 * interval);
    else if (type === 'monthly') cur.setMonth(cur.getMonth() + interval);
  }
  return results;
}

function getOccs(now) {
  const dayS = new Date(now); dayS.setHours(0,0,0,0);
  const dayE = new Date(now); dayE.setHours(23,59,59,999);
  const result = [];
  Object.entries(_reservations).forEach(([id, res]) => {
    expandRec(id, res, dayS, dayE).forEach(o => result.push(o));
  });
  return result.filter(r => _locals.includes(parseInt(r.localId)));
}

// ── Horloge ───────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('pubClock').textContent = `${hh}:${mm}:${ss}`;
  const dateStr = now.toLocaleDateString('fr-BE', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  document.getElementById('pubDate').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
  const h = isBelgianHoliday(isoDate(now));
  document.body.classList.toggle('is-holiday', h);
}

// ── Filtre écran ──────────────────────────────────────────────────
// Si ?screen={id} → restreindre _locals aux locaux de cet écran
function _applyScreenFilter() {
  if (!_screenParam) return;
  const screen = _config.screens[_screenParam];
  if (!screen) return;
  const screenLocals = screen.localIds
    ? Object.keys(screen.localIds).map(Number).sort((a,b) => a-b)
    : [];
  if (screenLocals.length) {
    _locals = screenLocals;
    const subEl = document.getElementById('pubSubtitle');
    if (subEl) subEl.textContent = screen.name || 'Écran';
  }
}

// ── Rendu ─────────────────────────────────────────────────────────
function render() {
  const now  = new Date();
  const occs = getOccs(now);

  // Message du jour public
  const msg = _config.messageJourPublic;
  const msgEl = document.getElementById('pubMessage');
  if (msg) {
    document.getElementById('pubMsgText').textContent = msg;
    const metaEl = document.getElementById('pubMsgMeta');
    const at = _config.messageJourPublicAt;
    if (at) {
      const d = new Date(at);
      const dateStr = d.toLocaleDateString('fr-BE', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = d.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
      metaEl.textContent = `Mis à jour le ${dateStr} à ${timeStr}`;
    } else {
      metaEl.textContent = '';
    }
    msgEl.classList.remove('hidden');
  } else {
    msgEl.classList.add('hidden');
  }

  const main = document.getElementById('pubMain');
  const holidayName = isBelgianHoliday(isoDate(now)) ? getHolidayName(isoDate(now)) : '';

  if (holidayName) {
    main.innerHTML = `<div class="pub-holiday">
      <div class="pub-holiday-flag">🇧🇪</div>
      <div class="pub-holiday-name">${holidayName}</div>
      <div class="pub-holiday-sub">Le CPAS est fermé aujourd'hui</div>
    </div>`;
    return;
  }

  // ── Cartes de file de groupe ────────────────────────────────────
  const groupCards = Object.entries(_config.queueGroups || {}).map(([grpId, grp]) => {
    const allLids  = (grp.localIds || []).map(Number).filter(l => _locals.includes(l));
    if (!allLids.length) return '';
    // Seuls les bureaux explicitement ouverts comptent
    const lids = allLids.filter(l => _bureauState[String(l)]?.open);
    if (!lids.length) return '';
    // Un bureau est occupé si : file locale, busyWithPreferred, ou préférence en attente (Réservé)
    const occupied = lids.filter(l => isLocalBusy(l) || !!_preferredPending[String(l)]).length;
    const paused   = lids.filter(l => !isLocalBusy(l) && !_preferredPending[String(l)] && !!_bureauState[String(l)]?.pause).length;
    const overflow = _prevQueue[`wait_${grpId}`] ?? 0;
    const total    = lids.length;
    const waiting  = overflow; // personnes en attente au-delà de la capacité

    const free = total - occupied - paused;
    let statusHtml, cardClass;
    if (waiting > 0) {
      cardClass  = 'pub-grp-busy';
      statusHtml = `<div class="pub-grp-status grp-busy">${waiting} personne${waiting > 1 ? 's' : ''} en attente</div>`;
    } else if (free === 0) {
      cardClass  = 'pub-grp-busy';
      statusHtml = `<div class="pub-grp-status grp-busy">Aucun bureau disponible</div>`;
    } else {
      cardClass  = free === total ? 'pub-grp-free' : 'pub-grp-active';
      statusHtml = `<div class="pub-grp-status ${free === total ? 'grp-free' : 'grp-active'}">${free} bureau${free > 1 ? 'x' : ''} disponible${free > 1 ? 's' : ''}</div>`;
    }

    const dots = lids.map(l => {
      const reserved = !!_preferredPending[String(l)];
      const busy     = isLocalBusy(l) || reserved;
      const isPaused = !busy && !!_bureauState[String(l)]?.pause;
      return `<span class="pub-grp-dot${isPaused ? ' paused' : busy ? ' busy' : ''}"></span>`;
    }).join('');

    const gcCfg      = getTicketDisplay('groupCard');
    const tickIssued = _prevQueue[`tick_${grpId}`] || 0;
    const tickCalled = _prevQueue[`tcall_${grpId}`] || 0;
    const namesMap   = _prevQueue[`names_${grpId}`] || {};
    const prefix     = (grp.name || 'T').trim()[0].toUpperCase();
    const fmt        = n => `${prefix}${String(n).padStart(2, '0')}`;
    const skipMap = _prevQueue[`skip_${grpId}`] || {};
    const waitingTickets = [];
    for (let i = tickCalled + 1; i <= tickIssued; i++) {
      if (skipMap[String(i)]) continue; // ticket reçu hors-ordre, ne pas afficher
      const num  = fmt(i);
      const name = gcCfg.showName ? (namesMap[String(i)] || null) : null;
      waitingTickets.push({ num, name });
    }
    const ticketsHtml = gcCfg.showNum && waitingTickets.length
      ? `<div class="pub-grp-tickets">
          <span class="pub-grp-tickets-label">En attente :</span>
          <div class="pub-grp-ticket-list">
            ${waitingTickets.map(({ num, name }) =>
              `<span class="pub-grp-ticket">${num}${name ? `<span class="pub-grp-ticket-name"> · ${escapeHtml(name)}</span>` : ''}</span>`
            ).join('')}
          </div>
        </div>`
      : '';

    return `<div class="pub-grp-card ${cardClass}">
      <div class="pub-grp-name">${grp.name}</div>
      ${statusHtml}
      <div class="pub-grp-dots">${dots}</div>
      <div class="pub-grp-cap">${occupied}/${total} bureaux</div>
      ${ticketsHtml}
    </div>`;
  }).join('');

  const bureauCards = _locals.map(l => {
    const pref = _preferredPending[String(l)];
    const prefBanner = pref
      ? `<div class="pub-pref-banner">👤 <strong>${escapeHtml(pref.displayName || '?')}</strong> sera reçu(e) par ${escapeHtml(pref.agentPublicName || '?')}</div>`
      : '';
    const perm = occs.find(r => parseInt(r.localId) === l && r.isPermanent);
    const res  = occs.find(r => parseInt(r.localId) === l && !r.isPermanent && r._start <= now && r._end > now);
    const next = !perm && !res
      ? occs.filter(r => parseInt(r.localId) === l && !r.isPermanent && r._start > now)
             .sort((a,b) => a._start - b._start)[0]
      : null;
    const label = getPublicLocalLabel(l);

    const isOpen = !!_bureauState[String(l)]?.open;
    const desc   = getLocalDescription(l);
    const descHtml = desc ? `<div class="pub-card-desc">${escapeHtml(desc)}</div>` : '';

    // Bureau non ouvert → Fermé, sauf si une réservation est active maintenant
    if (!isOpen) {
      const activeRes = perm || res; // perm ou réservation en cours
      if (activeRes) {
        const agt = activeRes.agent === 'Autre' ? activeRes.agentCustom : activeRes.agent;
        const grpHtml = localQueueGroupsHtml(l) || `<div class="pub-card-svc">${escapeHtml(activeRes.service === 'Autre' ? activeRes.serviceCustom : (activeRes.service || ''))}</div>`;
        return `<div class="pub-card pub-opening">
          <div class="pub-card-label">${label}</div>
          <div class="pub-card-status">🟠 Ouverture imminente</div>
          ${grpHtml}
          <div class="pub-card-agt">${escapeHtml(getAgentPublicName(agt) || '')}</div>
          <div class="pub-card-opening-hint">Le bureau ne va pas tarder à ouvrir</div>
          ${descHtml}
        </div>`;
      }
      return `<div class="pub-card pub-closed">
        <div class="pub-card-label">${label}</div>
        <div class="pub-card-status">⚫ Fermé</div>
        ${descHtml}
      </div>`;
    }

    // Bureau en pause
    const pause = _bureauState[String(l)]?.pause || null;
    if (pause) {
      const elapsed   = (Date.now() - pause.startedAt) / 60000;
      const rem       = pause.estimatedMin
        ? Math.max(0, Math.round(pause.estimatedMin - elapsed))
        : null;
      const timerTxt  = rem !== null ? (rem === 0 ? 'Retour imminent' : `Retour dans ${rem} min`) : '';
      return `<div class="pub-card pub-pause">
        <div class="pub-card-label">${label}</div>
        <div class="pub-card-status">⏸ En pause</div>
        ${timerTxt ? `<div class="pub-card-pause-timer" data-started="${pause.startedAt}" data-dur="${pause.estimatedMin || 0}">${timerTxt}</div>` : ''}
        ${pause.comment ? `<div class="pub-card-pause-comment">${escapeHtml(pause.comment)}</div>` : ''}
        ${descHtml}
        ${prefBanner}
      </div>`;
    }

    if (perm) {
      const agt = perm.agent === 'Autre' ? perm.agentCustom : perm.agent;
      const permGrpHtml = localQueueGroupsHtml(l) || `<div class="pub-card-svc">${escapeHtml(perm.service === 'Autre' ? perm.serviceCustom : (perm.service || ''))}</div>`;
      return `<div class="pub-card pub-perm">
        <div class="pub-card-label">${label}</div>
        <div class="pub-card-status">🔒 Permanent</div>
        ${permGrpHtml}
        <div class="pub-card-agt">${getAgentPublicName(agt)}</div>
        ${descHtml}
        ${prefBanner}
      </div>`;
    }

    if (res) {
      const svc   = res.service === 'Autre' ? res.serviceCustom : res.service;
      const agt   = res.agent   === 'Autre' ? res.agentCustom  : res.agent;
      const endH  = res._end.toLocaleTimeString('fr-BE', { hour:'2-digit', minute:'2-digit' });
      const color = getAgentColor(agt);
      const queue    = getQueueForLocal(l);
      const busy     = isLocalBusy(l);
      const reserved = pref && !busy;
      const waiting  = Math.max(0, queue - 1);
      const cardClass  = reserved ? 'pub-reserved' : busy ? 'pub-busy' : 'pub-free';
      const statusIcon = reserved ? '🟡 Réservé' : busy ? '🔴 Occupé' : '🟢 Disponible';
      // Agent affiché : celui réellement déclaré dans le bureau, sinon celui de la réservation
      const actualKey   = _bureauState[String(l)]?.agentKey || null;
      const displayAgt  = actualKey ? (getAgentPublicNameByKey(actualKey) || getAgentPublicName(agt)) : getAgentPublicName(agt);
      // Ticket en cours (affiché uniquement quand occupé)
      const curCall = busy ? (_lastCallsData[String(l)] || null) : null;
      const pbcCfg  = getTicketDisplay('publicBureauCard');
      const ticketNumVal  = curCall ? (curCall.ticketLabel || curCall.ticketNum || null) : null;
      const ticketNameVal = curCall ? (curCall.ticketName || null) : null;
      const ticketParts   = [];
      if (pbcCfg.showNum  && ticketNumVal)  ticketParts.push(`🎟 n°${escapeHtml(String(ticketNumVal))}`);
      if (pbcCfg.showName && ticketNameVal) ticketParts.push(escapeHtml(String(ticketNameVal)));
      const ticketHtml = ticketParts.length ? `<div class="pub-card-ticket">${ticketParts.join(' — ')}</div>` : '';
      const resGrpHtml = localQueueGroupsHtml(l) || `<div class="pub-card-svc">${escapeHtml(svc || '')}</div>`;
      return `<div class="pub-card ${cardClass}" style="${color ? `border-top:6px solid ${color}` : ''}">
        <div class="pub-card-label">${label}</div>
        <div class="pub-card-status">${statusIcon}</div>
        ${ticketHtml}
        ${resGrpHtml}
        <div class="pub-card-agt">${displayAgt}</div>
        ${waiting > 0 ? `<div class="pub-card-until">${waiting} personne${waiting > 1 ? 's' : ''} en attente</div>` : ''}
        ${descHtml}
        ${prefBanner}
      </div>`;
    }

    // Bureau ouvert mais sans réservation active (walk-in / permanence)
    const declSvc   = _bureauState[String(l)]?.declaredService || null;
    const wiBusy     = isLocalBusy(l);
    // Si une demande preferred est en chemin → "Réservé" (pas encore avec l'agent)
    const wiReserved = pref && !wiBusy;
    const wiClass    = wiReserved ? 'pub-reserved' : wiBusy ? 'pub-busy' : 'pub-free';
    const wiStatus   = wiReserved ? '🟡 Réservé' : wiBusy ? '🔴 Occupé' : '🟢 Disponible';
    const wiWaiting  = Math.max(0, getQueueForLocal(l) - 1);
    const wiAgentKey = _bureauState[String(l)]?.agentKey || null;
    const wiAgentName = wiAgentKey ? getAgentPublicNameByKey(wiAgentKey) : null;
    // Ticket en cours (affiché uniquement quand occupé)
    const wiCurCall = wiBusy ? (_lastCallsData[String(l)] || null) : null;
    const wiPbcCfg  = getTicketDisplay('publicBureauCard');
    const wiTicketNumVal  = wiCurCall ? (wiCurCall.ticketLabel || wiCurCall.ticketNum || null) : null;
    const wiTicketNameVal = wiCurCall ? (wiCurCall.ticketName || null) : null;
    const wiTicketParts   = [];
    if (wiPbcCfg.showNum  && wiTicketNumVal)  wiTicketParts.push(`🎟 n°${escapeHtml(String(wiTicketNumVal))}`);
    if (wiPbcCfg.showName && wiTicketNameVal) wiTicketParts.push(escapeHtml(String(wiTicketNameVal)));
    const wiTicketHtml = wiTicketParts.length ? `<div class="pub-card-ticket">${wiTicketParts.join(' — ')}</div>` : '';
    const wiGrpHtml = localQueueGroupsHtml(l) || (declSvc ? `<div class="pub-card-svc">${escapeHtml(declSvc)}</div>` : '');
    return `<div class="pub-card ${wiClass}">
      <div class="pub-card-label">${label}</div>
      <div class="pub-card-status">${wiStatus}</div>
      ${wiTicketHtml}
      ${wiGrpHtml}
      ${wiAgentName ? `<div class="pub-card-agt">${escapeHtml(wiAgentName)}</div>` : ''}
      ${wiWaiting > 0 ? `<div class="pub-card-until">${wiWaiting} personne${wiWaiting > 1 ? 's' : ''} en attente</div>` : ''}
      ${descHtml}
      ${prefBanner}
    </div>`;
  }).join('');

  // ── Prochaines permanences (lieux configurés en admin) ──────────
  const permLieuIds = Object.keys(_config.publicPermLieux || {});
  const permSection = permLieuIds.length ? (() => {
    const todayS = new Date(now); todayS.setHours(0,0,0,0);
    const todayE = new Date(now); todayE.setHours(23,59,59,999);
    const sections = permLieuIds.map(lieuId => {
      const lieu = (_config.lieux || []).find(l => l.id === lieuId);
      if (!lieu) return '';
      const lieuLabel = lieu.publicName || lieu.name || lieuId;
      const lieuLocalIds = lieu.localIds || [];
      const occs = [];
      Object.entries(_reservations).forEach(([id, res]) => {
        if (!lieuLocalIds.includes(parseInt(res.localId))) return;
        expandRec(id, res, todayS, todayE).forEach(o => {
          if (!o.isPermanent && o._end > now) occs.push(o);
        });
      });
      occs.sort((a, b) => (a._start||0) - (b._start||0));
      if (!occs.length) return '';
      const rows = occs.map(r => {
        const svc  = r.service === 'Autre' ? r.serviceCustom : r.service;
        const agt  = r.agent   === 'Autre' ? r.agentCustom   : r.agent;
        const loc  = _config.publicLabels[r.localId] || _config.localLabels[r.localId] || `Local ${r.localId}`;
        const hm   = r._start.toLocaleTimeString('fr-BE', { hour:'2-digit', minute:'2-digit' });
        const hme  = r._end?.toLocaleTimeString('fr-BE',  { hour:'2-digit', minute:'2-digit' }) || '';
        const active = r._start <= now;
        return `<div class="pub-perm-row${active ? ' pub-perm-now' : ''}">
          <span class="pub-perm-time">${hm}${hme ? `–${hme}` : ''}</span>
          <span class="pub-perm-svc">${escapeHtml(svc || '')}</span>
          <span class="pub-perm-agt">${escapeHtml(getAgentPublicName(agt) || '')}</span>
          <span class="pub-perm-loc">📍 ${escapeHtml(loc)}</span>
        </div>`;
      }).join('');
      return `<div class="pub-section-header">🕐 Permanences — ${escapeHtml(lieuLabel)}</div>
        <div class="pub-perm-list">${rows}</div>`;
    }).filter(Boolean).join('<div class="pub-section-divider"></div>');
    return sections ? `<div class="pub-section-divider"></div>${sections}` : '';
  })() : '';

  // Assembler les deux sections
  const grpSection = groupCards
    ? `<div class="pub-section-header">Services disponibles</div>${groupCards}
       <div class="pub-section-divider"></div>`
    : '';
  const bureauSection = `<div class="pub-section-header">🏢 Bureaux</div>${bureauCards}`;
  main.innerHTML = grpSection + bureauSection + permSection;

  document.getElementById('pubLastUpdate').textContent =
    `Dernière mise à jour : ${now.toLocaleTimeString('fr-BE', { hour:'2-digit', minute:'2-digit' })}`;
}

// ── Init Firebase listeners ───────────────────────────────────────
db.ref(`orgs/${ORG_ID}/reservations`).on('value', snap => {
  _reservations = snap.val() || {};
  render();
});

db.ref(`orgs/${ORG_ID}/appConfig`).on('value', snap => {
  const d = snap.val() || {};
  const meta = d?.meta || {};
  const name = meta.name || ORG_ID;
  const nameEl = document.getElementById('pubOrgName');
  if (nameEl) { nameEl.textContent = name; document.title = `${name} — État des locaux`; }
  if (meta.logoUrl) {
    const img = document.getElementById('pubLogo');
    if (img) { img.src = meta.logoUrl; img.onerror = () => { img.src = 'assets/logo.jpg'; }; }
  }
  _config.agents      = d.agents   ? Object.entries(d.agents).map(([k,v]) => ({key:k, name:v})) : [];
  _config.localLabels = d.localLabels || {};
  _config.agentColors = d.agentColors || {};
  _config.agentEmojis = d.agentEmojis || {};
  _config.features    = d.features    || {};
  _config.messageJour           = d.messageJour           || '';
  _config.messageJourAt         = d.messageJourAt         || null;
  _config.messageJourPublic     = d.messageJourPublic     || '';
  _config.messageJourPublicAt   = d.messageJourPublicAt   || null;
  _config.publicLabels        = d.publicLabels        || {};
  _config.localDescriptions   = d.localDescriptions   || {};
  _config.agentPublicNames    = d.agentPublicNames    || {};
  _config.queueGroups       = d.queueGroups       || {};
  _config.screens           = d.screens           || {};
  _config.publicPermLieux   = d.publicPermLieux   || {};
  _config.ticketDisplay     = d.ticketDisplay     || {};
  // lieux avec publicName et localIds (pour les permanences)
  _config.lieux = d.lieux
    ? Object.entries(d.lieux).map(([id, l]) => ({
        id,
        name:       l.name || '',
        publicName: l.publicName || l.name || '',
        localIds:   l.localIds ? Object.keys(l.localIds).map(Number) : [],
      }))
    : [];

  // Lieu — prendre le premier ou celui sauvegardé
  if (d.lieux) {
    const sorted = Object.entries(d.lieux)
      .map(([id, l]) => ({ id, name: l.name, order: l.order ?? 999, localIds: l.localIds ? Object.keys(l.localIds).map(Number) : [] }))
      .sort((a,b) => a.order - b.order);
    const saved = localStorage.getItem('cpas_currentLieu');
    const found = saved && sorted.find(l => l.id === saved);
    const active = found || sorted[0];
    if (active) { _currentLieuId = active.id; _locals = active.localIds; }
  }

  // Filtrer par écran si ?screen= est présent
  _applyScreenFilter();
  render();
});

db.ref(`orgs/${ORG_ID}/agentStatus/${isoDate(new Date())}`).on('value', snap => {
  _agentStatus = snap.val() || {};
  render();
});

// ── Son (Web Audio API) ───────────────────────────────────────────
let _audioCtx   = null;
let _audioReady = false;
let _soundLevel = 1; // 0=muet 0.5=discret 1=normal 1.5=fort 2=très fort

function _ensureAudio() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
}

function playChime() {
  if (_soundLevel === 0) return;
  try {
    _ensureAudio();
    // Carillon ascendant : Do - Mi - Sol - Do (octave)
    [[523.25, 0], [659.25, 0.22], [783.99, 0.44], [1046.50, 0.66]].forEach(([freq, delay]) => {
      const osc  = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.connect(gain);
      gain.connect(_audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t   = _audioCtx.currentTime + delay;
      const vol = Math.min(1, 0.35 * _soundLevel);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(vol, t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
      osc.start(t);
      osc.stop(t + 0.72);
    });
  } catch (e) { console.warn('Audio non disponible', e); }
}

// Déverrouillage son au premier clic (requis par les navigateurs)
document.addEventListener('click', () => {
  if (_audioReady) return;
  _ensureAudio();
  _audioReady = true;
  document.getElementById('soundUnlock').classList.add('hidden');
}, { once: false });

// Afficher le banner si le contexte est suspendu
window.addEventListener('load', () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') {
    document.getElementById('soundUnlock').classList.remove('hidden');
  }
  ctx.close();
});

// ── Popup "Bénéficiaire suivant" ─────────────────────────────────
let _prevQueue = {};
let _queueReady = false;
let _callDismissTimer = null;
let _preferredPending = {}; // { localId: { displayName, agentPublicName, requestId } }

function showNextCall(localId, agentName, groupName, ticketNum, ticketLabel, ticketName) {
  const bureauLabel = getPublicLocalLabel(localId);
  playChime();
  document.getElementById('nextCallBell').textContent  = '🔔';
  document.getElementById('nextCallLabel').textContent = 'Bénéficiaire suivant';

  // Numéro de ticket (ticketLabel prioritaire, sinon ticketNum si c'est un code)
  const label   = ticketLabel || (!ticketName ? ticketNum : null);
  const nameVal = ticketName  || (ticketLabel ? ticketNum : null); // nom = ticketName ou display si label séparé
  const pcCfg   = getTicketDisplay('publicCall');

  const ticketEl = document.getElementById('nextCallTicket');
  if (pcCfg.showNum && label) {
    ticketEl.textContent = `n°${label}`;
    ticketEl.classList.remove('hidden');
  } else {
    ticketEl.classList.add('hidden');
  }

  const nameEl = document.getElementById('nextCallName');
  if (pcCfg.showName && nameVal) {
    nameEl.textContent = nameVal;
    nameEl.classList.remove('hidden');
  } else {
    nameEl.classList.add('hidden');
  }

  const grpEl = document.getElementById('nextCallGroup');
  if (groupName) {
    grpEl.textContent = groupName;
    grpEl.classList.remove('hidden');
  } else {
    grpEl.classList.add('hidden');
  }

  document.getElementById('nextCallBureau').textContent = bureauLabel;

  const agentEl = document.getElementById('nextCallAgent');
  if (agentName) {
    agentEl.textContent = `Vous serez accueilli(e) par ${agentName}`;
    agentEl.classList.remove('hidden');
  } else {
    agentEl.classList.add('hidden');
  }

  document.getElementById('nextCallHint').textContent = 'Veuillez vous présenter au bureau';
  document.getElementById('nextCallQueue').classList.add('hidden');
  const overlay = document.getElementById('nextCallOverlay');
  overlay.classList.remove('hidden');
  if (_callDismissTimer) clearTimeout(_callDismissTimer);
  _callDismissTimer = setTimeout(() => overlay.classList.add('hidden'), 10000);
}

document.getElementById('nextCallOverlay').addEventListener('click', () => {
  document.getElementById('nextCallOverlay').classList.add('hidden');
  if (_callDismissTimer) clearTimeout(_callDismissTimer);
});

// Écoute Firebase — état ouverture bureaux
let _bureauState = {};
db.ref(`orgs/${ORG_ID}/appState/bureaux`).on('value', snap => {
  _bureauState = snap.val() || {};
  render();
});

// Écoute Firebase — niveau de volume son
db.ref(`orgs/${ORG_ID}/appConfig/features/soundLevel`).on('value', snap => {
  const v = snap.val();
  _soundLevel = (v !== null && v !== undefined) ? Number(v) : 1;
});

// Écoute Firebase — file d'attente (rendu uniquement, pas de popup)
db.ref(`orgs/${ORG_ID}/queues/${isoDate(new Date())}`).on('value', snap => {
  _prevQueue  = snap.val() || {};
  _queueReady = true;
  render();
});

// Écoute Firebase — appel bénéficiaire (écrit par l'agent via "Je suis disponible")
let _lastCallTs = null;
db.ref(`orgs/${ORG_ID}/appState/lastCall`).on('value', snap => {
  const d = snap.val();
  if (!d || !d.ts) return;
  if (_lastCallTs === null) { _lastCallTs = d.ts; return; } // ignorer valeur initiale
  if (d.ts === _lastCallTs) return;
  _lastCallTs = d.ts;
  if (_locals.includes(Number(d.localId))) {
    showNextCall(Number(d.localId), d.agentName || null, d.groupName || null, d.ticketNum || null, d.ticketLabel || null, d.ticketName || null);
  }
});

// Écoute Firebase — dernier ticket appelé par bureau (pour affichage carte publique)
db.ref(`orgs/${ORG_ID}/appState/lastCalls`).on('value', snap => {
  _lastCallsData = snap.val() || {};
  render();
});

// Écoute Firebase — bénéficiaires préférentiels en attente par bureau
db.ref(`orgs/${ORG_ID}/appState/preferredPending`).on('value', snap => {
  _preferredPending = snap.val() || {};
  render();
});

// Horloge chaque seconde
setInterval(updateClock, 1000);
updateClock();

// Mise à jour des timers de pause (toutes les 30 secondes, sans re-render complet)
setInterval(() => {
  document.querySelectorAll('.pub-card-pause-timer[data-dur]').forEach(el => {
    const dur  = parseInt(el.dataset.dur);
    if (!dur) return;
    const started = parseInt(el.dataset.started);
    const rem  = Math.max(0, Math.round(dur - (Date.now() - started) / 60000));
    el.textContent = rem === 0 ? 'Retour imminent' : `Retour dans ${rem} min`;
  });
}, 30000);
</script>
