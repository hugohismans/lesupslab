<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPAS de Quaregnon — Réservation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <img src="assets/logo.jpg" alt="Logo CPAS" class="login-logo">
      <h1>CPAS de Quaregnon</h1>
      <p class="login-sub">Réservation des locaux · Accès réservé au personnel</p>
      <form id="loginForm">
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <p id="loginErr" class="err-msg hidden">Mot de passe incorrect.</p>
        <button type="submit" class="btn-primary full">Se connecter</button>
      </form>
      <div class="login-footer">Développé par Hugo Hismans</div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
