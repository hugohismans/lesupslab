<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FlubberWorld</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:'Nunito',sans-serif;color:#fff;}
canvas{display:block;}

/* ── LOGIN ── */
#login{position:fixed;inset:0;background:rgba(0,0,0,.93);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;z-index:100;gap:32px;flex-wrap:wrap;padding:20px;}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:36px 32px;width:320px;text-align:center;animation:cardIn .5s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;}
@keyframes cardIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
h1{font-family:'Fredoka One',cursive;font-size:2.2rem;letter-spacing:1px;margin-bottom:4px;}
.sub{color:rgba(255,255,255,.4);font-size:.82rem;margin-bottom:22px;}
.preview{width:64px;height:64px;border-radius:50% 50% 44% 44%;margin:0 auto 20px;position:relative;animation:bIdle 2s ease-in-out infinite;}
.preview::before,.preview::after{content:'';position:absolute;background:rgba(255,255,255,.9);border-radius:50%;width:11px;height:11px;top:17px;}
.preview::before{left:13px;}.preview::after{right:13px;}
@keyframes bIdle{0%,100%{transform:scaleX(1) scaleY(1);}50%{transform:scaleX(1.12) scaleY(.9);}}
label{display:block;text-align:left;font-size:.68rem;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
input[type=text]{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 13px;color:#fff;font-family:'Nunito',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s;margin-bottom:16px;}
input[type=text]:focus{border-color:rgba(255,255,255,.4);}
.cpicker{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;}
.cdot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s,border-color .15s;}
.cdot:hover{transform:scale(1.15);}.cdot.sel{border-color:#fff;transform:scale(1.22);}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-family:'Fredoka One',cursive;font-size:1.15rem;cursor:pointer;transition:transform .15s,opacity .15s;}
.btn:hover{transform:translateY(-2px);opacity:.9;}

/* ── LOGIN SPAWN MAP ── */
#spawn-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:24px;animation:cardIn .5s .1s cubic-bezier(.34,1.56,.64,1) both;flex-shrink:0;}
#spawn-card h2{font-family:'Fredoka One',cursive;font-size:1.2rem;margin-bottom:6px;color:rgba(255,255,255,.8);}
#spawn-card p{font-size:.75rem;color:rgba(255,255,255,.35);margin-bottom:14px;}
#spawn-map-wrap{position:relative;cursor:crosshair;}
#spawn-map{display:block;border-radius:10px;border:1px solid rgba(255,255,255,.1);image-rendering:pixelated;}
#spawn-cursor{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%);pointer-events:none;transition:left .1s,top .1s;box-shadow:0 0 8px rgba(255,255,255,.5);}
#spawn-coords{font-size:.72rem;color:rgba(255,255,255,.35);margin-top:8px;text-align:center;font-family:monospace;}

/* ── HUD ── */
#hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:50px;padding:7px 20px 7px 10px;z-index:50;backdrop-filter:blur(10px);}
.hdot{width:26px;height:26px;border-radius:50%;animation:bIdle 2s ease-in-out infinite;}
.hname{font-weight:700;font-size:.9rem;}.hsep{color:rgba(255,255,255,.2);}.hcount{color:rgba(255,255,255,.4);font-size:.8rem;}

/* ── BRUSH HUD ── */
#brush-hud{position:fixed;top:14px;left:14px;display:none;align-items:center;gap:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:50px;padding:7px 16px;z-index:50;backdrop-filter:blur(10px);font-size:.8rem;color:rgba(255,255,255,.5);}
.bkeys{display:flex;gap:4px;}
.bkey{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:rgba(255,255,255,.4);transition:all .15s;}
.bkey.active{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.6);color:#fff;}
.bsize{border-radius:50%;background:#fff;transition:all .2s;flex-shrink:0;}

/* ── CONTROLS HINT ── */
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:50;}
.chip{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:5px 12px;font-size:.72rem;color:rgba(255,255,255,.4);}
.chip b{color:rgba(255,255,255,.85);}

/* ── PLAYERS LIST ── */
#plist{position:fixed;top:58px;right:14px;display:none;flex-direction:column;gap:5px;z-index:50;max-width:140px;}
.pbadge{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:6px 11px;display:flex;align-items:center;gap:7px;font-size:.76rem;backdrop-filter:blur(8px);animation:fin .25s ease;}
@keyframes fin{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.pdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

/* ── MINIMAP ── */
#minimap-wrap{
  position:fixed;bottom:18px;right:18px;
  display:none;z-index:50;
  background:rgba(0,0,0,.75);
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;padding:8px;
  backdrop-filter:blur(10px);
}
#minimap-wrap:hover #minimap-hint{opacity:1;}
#minimap-hint{position:absolute;top:-28px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:3px 10px;font-size:.68rem;color:rgba(255,255,255,.6);opacity:0;transition:opacity .2s;pointer-events:none;}
#minimap-canvas{display:block;border-radius:7px;image-rendering:pixelated;cursor:crosshair;}
#minimap-overlay{position:absolute;top:8px;left:8px;border-radius:7px;pointer-events:none;}
#minimap-label{font-size:.62rem;color:rgba(255,255,255,.3);text-align:center;margin-top:5px;letter-spacing:.5px;}

/* ── STATUS ── */
#status{position:fixed;bottom:18px;left:18px;font-size:.7rem;color:rgba(255,255,255,.3);z-index:50;display:none;}
#status.ok{color:#6affb0;}#status.err{color:#ff7e7e;}

/* ── MOBILE ── */
#jleft,#jright{position:fixed;bottom:70px;width:110px;height:110px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:50%;display:none;align-items:center;justify-content:center;z-index:60;touch-action:none;}
#jleft{left:28px;}#jright{right:28px;}
.jknob{width:44px;height:44px;background:rgba(255,255,255,.18);border-radius:50%;pointer-events:none;position:absolute;}
</style>

const PALETTE    = ['#6affb0','#ff6eb4','#6eaaff','#ffe46e','#c46eff','#ff8c4a','#6ef0ff','#ff6e6e'];
const WORLD_W    = 40;
const GRID_N     = 80;
const PAINT_RES  = 512;
const MAP_SIZE   = 200;
const BRUSH_SIZES= [.5, 1.2, 2.4];
const BRUSH_PX   = [7, 13, 22];

let myColor = PALETTE[0], myName = 'Flubber', brushIdx = 0;

/* ══════════════════════════════════════
   GRID
══════════════════════════════════════ */
const grid = new Array(GRID_N * GRID_N).fill(null);

function worldToCell(wx, wz) {
  return {
    cx: Math.max(0, Math.min(GRID_N-1, Math.floor((wx + WORLD_W) / (WORLD_W*2) * GRID_N))),
    cz: Math.max(0, Math.min(GRID_N-1, Math.floor((wz + WORLD_W) / (WORLD_W*2) * GRID_N)))
  };
}
function cellToWorld(cx, cz) {
  return {
    wx: (cx + .5) / GRID_N * WORLD_W*2 - WORLD_W,
    wz: (cz + .5) / GRID_N * WORLD_W*2 - WORLD_W
  };
}

/* ══════════════════════════════════════
   COLOR PICKER
══════════════════════════════════════ */
const cpEl = document.getElementById('cpicker');
PALETTE.forEach((c,i) => {
  const d = document.createElement('div');
  d.className = 'cdot'+(i===0?' sel':'');
  d.style.background = c;
  d.onclick = () => {
    document.querySelectorAll('.cdot').forEach(x=>x.classList.remove('sel'));
    d.classList.add('sel'); myColor = c;
    document.getElementById('prev').style.background = c;
    document.getElementById('bjoin').style.background = c;
    updateSpawnCursor();
  };
  cpEl.appendChild(d);
});

/* ══════════════════════════════════════
   LOGIN SPAWN MAP
══════════════════════════════════════ */
const spawnMapEl  = document.getElementById('spawn-map');
const spawnCurEl  = document.getElementById('spawn-cursor');
const spawnCoords = document.getElementById('spawn-coords');
const smCtx       = spawnMapEl.getContext('2d');
smCtx.fillStyle   = '#111'; smCtx.fillRect(0,0,280,280);
// grille légère
smCtx.strokeStyle = 'rgba(255,255,255,.06)';
for(let i=0;i<=8;i++){
  const p = i/8*280;
  smCtx.beginPath(); smCtx.moveTo(p,0); smCtx.lineTo(p,280); smCtx.stroke();
  smCtx.beginPath(); smCtx.moveTo(0,p); smCtx.lineTo(280,p); smCtx.stroke();
}

function updateSpawnCursor(){
  spawnCurEl.style.background = myColor;
  spawnCurEl.style.boxShadow  = `0 0 10px ${myColor}`;
}
updateSpawnCursor();

function spawnMapClick(e) {
  const rect = spawnMapEl.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width;
  const pz = (e.clientY - rect.top)  / rect.height;
  spawnX = (px - .5) * WORLD_W*2 * .95;
  spawnZ = (pz - .5) * WORLD_W*2 * .95;
  spawnCurEl.style.left = (px*100)+'%';
  spawnCurEl.style.top  = (pz*100)+'%';
  spawnCoords.textContent = `x: ${spawnX.toFixed(1)} · z: ${spawnZ.toFixed(1)}`;
}
spawnMapEl.addEventListener('click', spawnMapClick);
spawnMapEl.addEventListener('mousemove', e => {
  const rect = spawnMapEl.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width;
  const pz = (e.clientY - rect.top)  / rect.height;
  const hx = (px-.5)*WORLD_W*2*.95, hz = (pz-.5)*WORLD_W*2*.95;
  spawnCoords.textContent = `x: ${hx.toFixed(1)} · z: ${hz.toFixed(1)}`;
});

// Sync la login map avec la peinture Firebase (chargée plus tard)
function applyPaintToSpawnMap(cx,cz,color){
  const px = cx/GRID_N*280, pz = cz/GRID_N*280;
  const sz = 280/GRID_N;
  smCtx.fillStyle = color;
  smCtx.fillRect(px,pz,sz,sz);
}

/* ══════════════════════════════════════
   THREE.JS
══════════════════════════════════════ */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000,.016);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, .1, 300);

// Lights
scene.add(new THREE.AmbientLight(0x223355, 1.1));
const sun = new THREE.DirectionalLight(0xffffff,1.3);
sun.position.set(20,40,20); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-45; sun.shadow.camera.right=45;
sun.shadow.camera.top=45; sun.shadow.camera.bottom=-45;
sun.shadow.camera.far=130;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x3366ff,.35);
rim.position.set(-15,8,-15); scene.add(rim);

// Sol miroir
const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_W*2, WORLD_W*2),
  new THREE.MeshStandardMaterial({color:0x000000, roughness:.03, metalness:.99})
);
floorMesh.rotation.x=-Math.PI/2; floorMesh.receiveShadow=true;
scene.add(floorMesh);

// Paint canvas → texture
const paintCanvas = document.createElement('canvas');
paintCanvas.width = paintCanvas.height = PAINT_RES;
const pCtx = paintCanvas.getContext('2d');
pCtx.fillStyle='rgba(0,0,0,0)'; pCtx.fillRect(0,0,PAINT_RES,PAINT_RES);
const paintTex = new THREE.CanvasTexture(paintCanvas);
paintTex.minFilter = THREE.LinearFilter;
paintTex.magFilter = THREE.NearestFilter;

const paintPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_W*2, WORLD_W*2),
  new THREE.MeshBasicMaterial({map:paintTex, transparent:true, depthWrite:false, opacity:.95})
);
paintPlane.rotation.x=-Math.PI/2; paintPlane.position.y=.003;
scene.add(paintPlane);

const reflPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_W*2, WORLD_W*2),
  new THREE.MeshBasicMaterial({map:paintTex, transparent:true, depthWrite:false, opacity:.18, blending:THREE.AdditiveBlending})
);
reflPlane.rotation.x=-Math.PI/2; reflPlane.position.y=.001;
scene.add(reflPlane);

/* ══════════════════════════════════════
   MINIMAP (200×200)
══════════════════════════════════════ */
const mmCanvas  = document.getElementById('minimap-canvas');
const mmOverlay = document.getElementById('minimap-overlay');
const mmCtx     = mmCanvas.getContext('2d');
const moCtx     = mmOverlay.getContext('2d');
mmCtx.fillStyle = '#111'; mmCtx.fillRect(0,0,MAP_SIZE,MAP_SIZE);

// Clic minimap → téléporter
mmCanvas.addEventListener('click', e => {
  if (!myMesh) return;
  const rect = mmCanvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width;
  const pz = (e.clientY - rect.top)  / rect.height;
  const tx = (px - .5) * WORLD_W*2 * .97;
  const tz = (pz - .5) * WORLD_W*2 * .97;
  myMesh.position.x = tx;
  myMesh.position.z = tz;
  if (players[myId]) { players[myId].tx = tx; players[myId].tz = tz; }
});

/* ══════════════════════════════════════
   PAINT FUNCTIONS
══════════════════════════════════════ */
function paintCells(cellList) {
  if (!cellList.length) return;
  const cellPx  = PAINT_RES / GRID_N;
  const cellMap = MAP_SIZE  / GRID_N;
  cellList.forEach(({cx,cz,color}) => {
    pCtx.fillStyle = color;
    pCtx.fillRect(cx*cellPx, cz*cellPx, cellPx, cellPx);
    mmCtx.fillStyle = color;
    mmCtx.fillRect(cx*cellMap, cz*cellMap, Math.max(1,cellMap), Math.max(1,cellMap));
    applyPaintToSpawnMap(cx,cz,color);
  });
  paintTex.needsUpdate = true;
}

function paintAt(wx, wz, color, bSize) {
  const radius  = bSize;
  const rCells  = Math.ceil(radius / (WORLD_W*2) * GRID_N);
  const {cx:cx0, cz:cz0} = worldToCell(wx,wz);
  const toAdd = [];
  for (let dz=-rCells; dz<=rCells; dz++) {
    for (let dx=-rCells; dx<=rCells; dx++) {
      const cx=cx0+dx, cz=cz0+dz;
      if (cx<0||cx>=GRID_N||cz<0||cz>=GRID_N) continue;
      const {wx:wx2,wz:wz2} = cellToWorld(cx,cz);
      if (Math.hypot(wx2-wx, wz2-wz) > radius) continue;
      const idx = cz*GRID_N+cx;
      if (grid[idx]===color) continue;
      grid[idx]=color;
      toAdd.push({cx,cz,color});
    }
  }
  paintCells(toAdd);
  return toAdd;
}

/* ══════════════════════════════════════
   FLUBBER
══════════════════════════════════════ */
function makeFlubber(hex) {
  const g = new THREE.Group();

  // Corps organique déformé
  const bGeo = new THREE.SphereGeometry(.42,28,18);
  const pos  = bGeo.attributes.position;
  for (let i=0;i<pos.count;i++) {
    const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    const n=.045*(Math.sin(x*7.3)*Math.cos(y*5.8)+Math.sin(z*6.9+1.2));
    pos.setXYZ(i,x+n,y+n*.5,z+n);
  }
  bGeo.computeVertexNormals();
  const body=new THREE.Mesh(bGeo,new THREE.MeshStandardMaterial({color:hex,roughness:.22,metalness:.06,transparent:true,opacity:.94}));
  body.castShadow=true; body.scale.y=.72; body.position.y=.3; g.add(body);

  // Gel coat
  const gel=new THREE.Mesh(new THREE.SphereGeometry(.44,18,12),new THREE.MeshStandardMaterial({color:hex,roughness:0,metalness:0,transparent:true,opacity:.18}));
  gel.scale.y=.72; gel.position.y=.3; g.add(gel);

  // Yeux (montés sur un pivot pour regarder dans la direction du mouvement)
  const eyePivot = new THREE.Group();
  eyePivot.position.y = .3;
  g.add(eyePivot);
  const eM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.1});
  const pM=new THREE.MeshStandardMaterial({color:0x111111});
  const iC=new THREE.Color(hex); iC.multiplyScalar(1.6);
  const iM=new THREE.MeshStandardMaterial({color:iC});
  const pupils = [];
  [-1,1].forEach(s=>{
    const e=new THREE.Mesh(new THREE.SphereGeometry(.07,10,10),eM);
    const ir=new THREE.Mesh(new THREE.SphereGeometry(.046,8,8),iM);
    const p=new THREE.Mesh(new THREE.SphereGeometry(.028,6,6),pM);
    e.position.set(s*.13,.1,.33);
    ir.position.set(s*.13,.1,.365);
    p.position.set(s*.13,.1,.375);
    eyePivot.add(e,ir,p);
    pupils.push(p);
  });

  // Reflet
  const sh=new THREE.Mesh(new THREE.SphereGeometry(.05,5,5),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.55,roughness:0}));
  sh.position.set(-.11,.47,.26); g.add(sh);

  // Ombre blob
  const sb=new THREE.Mesh(new THREE.CircleGeometry(.4,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.45,depthWrite:false}));
  sb.rotation.x=-Math.PI/2; sb.position.y=.006; g.add(sb);

  // Bouche (arc - visible quand il bouge vite)
  const mouthGeo = new THREE.TorusGeometry(.12,.025,6,12,Math.PI);
  const mouthMat = new THREE.MeshStandardMaterial({color:0x111111,roughness:.5});
  const mouth = new THREE.Mesh(mouthGeo,mouthMat);
  mouth.position.set(0,.22,.38); mouth.rotation.z=Math.PI; mouth.scale.set(1,.4,1);
  g.add(mouth);

  // Tentacules/queue (3 petites sphères qui traînent derrière)
  const tentacles = [];
  const tCol = new THREE.Color(hex); tCol.multiplyScalar(.85);
  const tMat = new THREE.MeshStandardMaterial({color:tCol,roughness:.3,transparent:true,opacity:.85});
  [0,1,2].forEach(i=>{
    const tGeo = new THREE.SphereGeometry(.1-.02*i,8,6);
    const t = new THREE.Mesh(tGeo,tMat);
    t.castShadow=true;
    t.position.set((i-.5)*.15,-.05+(i*.05),-.3-.12*i);
    g.add(t);
    tentacles.push(t);
  });

  // Traînée gélatineuse (pool de meshes réutilisables)
  const trailPool = [];
  const trlMat = new THREE.MeshBasicMaterial({color:hex,transparent:true,opacity:.55,depthWrite:false});
  for(let i=0;i<10;i++){
    const tr=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),trlMat.clone());
    tr.scale.y=.3; tr.position.y=.04; tr.visible=false;
    scene.add(tr);
    trailPool.push({mesh:tr,life:0,maxLife:0});
  }

  // Bulles
  const bubbles = [];
  const bubMat = new THREE.MeshStandardMaterial({color:hex,transparent:true,opacity:.35,roughness:0,metalness:.1});
  for(let i=0;i<6;i++){
    const b=new THREE.Mesh(new THREE.SphereGeometry(.04+Math.random()*.04,6,6),bubMat.clone());
    b.visible=false;
    scene.add(b);
    bubbles.push({mesh:b,life:0,maxLife:0,ox:0,oz:0});
  }

  g.userData={body,gel,sb,eyePivot,mouth,tentacles,trailPool,bubbles,phase:Math.random()*Math.PI*2,lastTrail:0,lastBubble:0};
  return g;
}

function makeLabel(name,hex){
  const cv=document.createElement('canvas'); cv.width=256; cv.height=64;
  const ctx=cv.getContext('2d');
  ctx.font='bold 28px Nunito'; ctx.shadowColor=hex; ctx.shadowBlur=14;
  ctx.fillStyle='rgba(255,255,255,.92)'; ctx.textAlign='center'; ctx.fillText(name,128,42);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));
  sp.scale.set(2.2,.55,1); sp.position.y=1.25;
  return sp;
}

function animFlubber(g,speedNorm,t,dx,dz){
  const {body,gel,sb,eyePivot,mouth,tentacles,trailPool,bubbles,phase:ph}=g.userData;
  const now=Date.now();
  const moving=speedNorm>.01;
  const spd=Math.min(speedNorm,1);

  // ── Corps squash & stretch ──
  if(moving){
    const b=Math.abs(Math.sin(t*13+ph));
    const sq=.22*spd;
    body.scale.set(1+sq*.9,Math.max(.42,1-sq*1.3+b*.32),1+sq*.9);
    body.position.y=.3+b*.22*spd;
    body.rotation.z=Math.sin(t*11+ph)*.12*spd;
  } else {
    const b=Math.sin(t*2.1+ph);
    const wx=Math.sin(t*3.8+ph)*.045, wz=Math.sin(t*4.2+ph+1)*.045;
    body.scale.set(1+b*.055+wx,1-b*.042,1+b*.055+wz);
    body.position.y=.3+b*.02;
    body.rotation.z=Math.sin(t*1.9+ph)*.04;
  }
  if(gel){gel.scale.copy(body.scale);gel.position.y=body.position.y;}
  if(sb)sb.scale.set(1+spd*.7,1,1+spd*.7);

  // ── Yeux : regardent dans la direction du mouvement ──
  if(eyePivot){
    const targetYaw = (dx||dz) ? Math.atan2(dx||0,dz||0) : g.rotation.y;
    const curYaw = eyePivot.rotation.y;
    eyePivot.rotation.y += (targetYaw - curYaw) * .12;
    // Clignotement aléatoire
    const blinkPhase = Math.sin(t*1.3+ph*3);
    const blink = blinkPhase > .96 ? Math.max(0,1-(blinkPhase-.96)*50) : 1;
    eyePivot.scale.y = blink;
  }

  // ── Bouche : s'ouvre avec la vitesse ──
  if(mouth){
    const mOpen = moving ? Math.min(spd*2,.9) : .15+Math.sin(t*1.8+ph)*.08;
    mouth.scale.set(1+mOpen*.5, .4+mOpen*.8, 1);
    mouth.position.z = .36+mOpen*.04;
  }

  // ── Tentacules : se balancent en retard ──
  if(tentacles&&tentacles.length){
    tentacles.forEach((tent,i)=>{
      const lag = .18+i*.12;
      const swayX = Math.sin(t*4+ph+i*1.2)*(.06+spd*.12);
      const swayY = Math.abs(Math.sin(t*8+ph+i*.8))*(.04+spd*.08);
      const stretchZ = -.28-.14*i - spd*.18;
      tent.position.set(
        (i-1)*.16 + swayX,
        -.04+i*.03+swayY,
        stretchZ
      );
      tent.scale.set(1-i*.08, 1+spd*.3, 1-i*.08);
    });
  }

  // ── Traînée gélatineuse ──
  if(trailPool&&moving&&now-g.userData.lastTrail>80){
    const slot=trailPool.find(s=>!s.mesh.visible||s.life<=0);
    if(slot){
      slot.mesh.position.set(g.position.x,0.04,g.position.z);
      slot.mesh.scale.set(1+spd*.5,.3,1+spd*.5);
      slot.mesh.material.color.set(g.userData.body.material.color);
      slot.mesh.visible=true;
      slot.life=1; slot.maxLife=1;
    }
    g.userData.lastTrail=now;
  }
  if(trailPool){
    trailPool.forEach(s=>{
      if(!s.mesh.visible)return;
      s.life-=.022;
      if(s.life<=0){s.mesh.visible=false;return;}
      s.mesh.material.opacity=s.life*.45;
      s.mesh.scale.x+= .008; s.mesh.scale.z+=.008;
      s.mesh.scale.y=Math.max(.01,s.mesh.scale.y-.003);
    });
  }

  // ── Bulles ──
  if(bubbles&&now-g.userData.lastBubble>400+Math.random()*600){
    const slot=bubbles.find(b=>!b.mesh.visible||b.life<=0);
    if(slot){
      const angle=Math.random()*Math.PI*2;
      const r=.2+Math.random()*.15;
      slot.ox=g.position.x+Math.cos(angle)*r;
      slot.oz=g.position.z+Math.sin(angle)*r;
      slot.mesh.position.set(slot.ox,.15,slot.oz);
      slot.mesh.visible=true;
      slot.life=1; slot.maxLife=1;
      slot.mesh.material.color.set(g.userData.body.material.color);
    }
    g.userData.lastBubble=now;
  }
  if(bubbles){
    bubbles.forEach(b=>{
      if(!b.mesh.visible)return;
      b.life-=.008;
      if(b.life<=0){b.mesh.visible=false;return;}
      b.mesh.position.y+=.012;
      b.mesh.position.x=b.ox+Math.sin(t*3+b.life*10)*.03;
      b.mesh.position.z=b.oz+Math.cos(t*2.5+b.life*8)*.03;
      b.mesh.material.opacity=b.life*.4;
      const sc=.6+b.life*.4;
      b.mesh.scale.set(sc,sc,sc);
    });
  }
}

/* ══════════════════════════════════════
   MINIMAP DOTS
══════════════════════════════════════ */
function drawMinimapDots(){
  moCtx.clearRect(0,0,MAP_SIZE,MAP_SIZE);
  Object.values(players).forEach(p=>{
    const mx=(p.mesh.position.x+WORLD_W)/(WORLD_W*2)*MAP_SIZE;
    const my=(p.mesh.position.z+WORLD_W)/(WORLD_W*2)*MAP_SIZE;
    // halo
    moCtx.beginPath(); moCtx.arc(mx,my,6,0,Math.PI*2);
    moCtx.fillStyle='rgba(255,255,255,.2)'; moCtx.fill();
    // bordure
    moCtx.beginPath(); moCtx.arc(mx,my,4,0,Math.PI*2);
    moCtx.fillStyle='#fff'; moCtx.fill();
    // couleur
    moCtx.beginPath(); moCtx.arc(mx,my,3,0,Math.PI*2);
    moCtx.fillStyle=p.data.color; moCtx.fill();
    // nom
    moCtx.font='bold 9px Nunito'; moCtx.fillStyle='rgba(255,255,255,.7)';
    moCtx.textAlign='center'; moCtx.fillText(p.data.name,mx,my-8);
  });
}

/* ══════════════════════════════════════
   PLAYERS
══════════════════════════════════════ */
const players={};
let myMesh=null, myId=null, db=null, myRef=null;

function spawnPlayer(id,data){
  if(players[id])return;
  const mesh=makeFlubber(data.color);
  mesh.position.set(data.x||0,0,data.z||0);
  mesh.add(makeLabel(data.name,data.color));
  scene.add(mesh);
  players[id]={mesh,tx:data.x||0,tz:data.z||0,data};
}
function updatePlayer(id,data){
  if(!players[id]){spawnPlayer(id,data);return;}
  players[id].tx=data.x||0; players[id].tz=data.z||0; players[id].data=data;
}
function removePlayer(id){
  if(!players[id])return;
  scene.remove(players[id].mesh); delete players[id];
}

/* ══════════════════════════════════════
   CAMERA TPS
══════════════════════════════════════ */
let camYaw=0,camPitch=.28,pointerLocked=false;
const CAM_DIST=5.5,CAM_H=2.2;

canvas.addEventListener('click',()=>{if(myMesh)canvas.requestPointerLock();});
document.addEventListener('pointerlockchange',()=>{pointerLocked=document.pointerLockElement===canvas;});
document.addEventListener('mousemove',e=>{
  if(!pointerLocked)return;
  camYaw-=e.movementX*.0022;
  camPitch=Math.max(-.08,Math.min(.85,camPitch+e.movementY*.0022));
});
function updateCamera(){
  if(!myMesh)return;
  const mx=myMesh.position.x,mz=myMesh.position.z;
  camera.position.set(
    mx-Math.sin(camYaw)*Math.cos(camPitch)*CAM_DIST,
    CAM_H+Math.sin(camPitch)*CAM_DIST*.7,
    mz-Math.cos(camYaw)*Math.cos(camPitch)*CAM_DIST
  );
  camera.lookAt(mx,.4,mz);
}

   INPUT
══════════════════════════════════════ */
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Digit1')setBrush(0);
  if(e.code==='Digit2')setBrush(1);
  if(e.code==='Digit3')setBrush(2);
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

function setBrush(idx){
  brushIdx=idx;
  [0,1,2].forEach(i=>{document.getElementById(`bk${i+1}`).classList.toggle('active',i===idx);});
  const dot=document.getElementById('bsizedot');
  dot.style.width=BRUSH_PX[idx]+'px'; dot.style.height=BRUSH_PX[idx]+'px';
  dot.style.background=myColor;
}

// Mobile
const isMobile=/Mobi|Android/i.test(navigator.userAgent);
let jlDelta={x:0,y:0},jrDelta={x:0,y:0},jlActive=false,jrActive=false;
let jlOrigin={x:0,y:0},jrOrigin={x:0,y:0};
if(isMobile){
  document.getElementById('jleft').style.display='flex';
  document.getElementById('jright').style.display='flex';
  function jsetup(elId,knobId,origin,delta,setActive){
    const el=document.getElementById(elId),knob=document.getElementById(knobId);
    el.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];origin.x=t.clientX;origin.y=t.clientY;setActive(true);},{passive:false});
    el.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];
      const dx=t.clientX-origin.x,dy=t.clientY-origin.y;
      const d=Math.min(Math.hypot(dx,dy),42),a=Math.atan2(dy,dx);
      delta.x=Math.cos(a)*d/42;delta.y=Math.sin(a)*d/42;
      knob.style.transform=`translate(${Math.cos(a)*d*.6}px,${Math.sin(a)*d*.6}px)`;
    },{passive:false});
    el.addEventListener('touchend',()=>{setActive(false);delta.x=0;delta.y=0;knob.style.transform='';});
  }
  jsetup('jleft','jlknob',jlOrigin,jlDelta,v=>jlActive=v);
  jsetup('jright','jrknob',jrOrigin,jrDelta,v=>jrActive=v);
}

/* ══════════════════════════════════════
   LOOP
══════════════════════════════════════ */
const clock=new THREE.Clock();
let lastPaint=0,lastFBPos=0,lastFBPaint=0,lastDots=0;
const SPEED=7,HALF=WORLD_W-.5;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  const t=performance.now()*.001;
  const now=Date.now();

  if(myMesh){
    let fx=0,fz=0;
    // Codes physiques = indépendant AZERTY/QWERTY
    if(keys['KeyW']||keys['KeyZ']||keys['ArrowUp'])   fz=-1;
    if(keys['KeyS']||keys['ArrowDown'])               fz= 1;
    if(keys['KeyA']||keys['KeyQ']||keys['ArrowLeft']) fx=-1;
    if(keys['KeyD']||keys['ArrowRight'])              fx= 1;
    // Joystick gauche : x=droite/gauche, y=avant/arrière
    if(isMobile&&jlActive){fx=jlDelta.x; fz=jlDelta.y;}
    // Joystick droit : rotation caméra (signe corrigé)
    if(isMobile&&jrActive){camYaw-=jrDelta.x*.05;}

    const prevX=myMesh.position.x,prevZ=myMesh.position.z;
    if(fx!==0||fz!==0){
      // Vecteur forward = direction où regarde le joueur
      // Vérifié : yaw=0 → caméra derrière (z-), joueur regarde (z+)
      // forward = (sin(yaw), cos(yaw))
      // right   = (sin(yaw+PI/2), cos(yaw+PI/2)) = (cos(yaw), -sin(yaw))
      const fwdX = Math.sin(camYaw);
      const fwdZ = Math.cos(camYaw);
      const rgtX = Math.sin(camYaw + Math.PI/2);
      const rgtZ = Math.cos(camYaw + Math.PI/2);
      // fz=-1 → avancer (+ forward), fx=1 → droite (+ right)
      const mx = fwdX*(-fz) - rgtX*fx;
      const mz = fwdZ*(-fz) - rgtZ*fx;
      const len=Math.hypot(mx,mz)||1;
      myMesh.position.x=Math.max(-HALF,Math.min(HALF,myMesh.position.x+mx/len*SPEED*dt));
      myMesh.position.z=Math.max(-HALF,Math.min(HALF,myMesh.position.z+mz/len*SPEED*dt));
      myMesh.rotation.y=Math.atan2(mx,mz);
    }
    const dx=myMesh.position.x-prevX,dz=myMesh.position.z-prevZ;
    const spd=Math.hypot(dx,dz);

    // Paint sous le joueur
    if(now-lastPaint>50){
      const painted=paintAt(myMesh.position.x,myMesh.position.z,myColor,BRUSH_SIZES[brushIdx]);
      lastPaint=now;
      // Sync peinture Firebase : une clé par cellule (cx_cz) = pas de doublon
      if(db&&painted&&painted.length>0){
        painted.forEach(({cx,cz,color})=>{
          set(ref(db,`paint/${cx}_${cz}`),color).catch(e=>console.error('paint write error',e));
        });
        lastFBPaint=now;
      }
    }
    // Sync position Firebase (throttle séparé)
    if(db&&now-lastFBPos>100){
      set(myRef,{name:myName,color:myColor,x:+myMesh.position.x.toFixed(2),z:+myMesh.position.z.toFixed(2),ts:now})
        .catch(e=>console.error('pos write error',e));
      lastFBPos=now;
    }
    document.getElementById('bsizedot').style.background=myColor;
    animFlubber(myMesh,spd/(SPEED*dt+.001),t,dx,dz);
    updateCamera();
  }

  Object.entries(players).forEach(([id,p])=>{
    if(p.mesh===myMesh)return;
    const ox=p.mesh.position.x,oz=p.mesh.position.z;
    p.mesh.position.x+=(p.tx-p.mesh.position.x)*.14;
    p.mesh.position.z+=(p.tz-p.mesh.position.z)*.14;
    const rdx=p.mesh.position.x-ox, rdz=p.mesh.position.z-oz;
    animFlubber(p.mesh,Math.hypot(rdx,rdz)*8,t,rdx,rdz);
  });

  if(now-lastDots>33){drawMinimapDots();lastDots=now;}
  renderer.render(scene,camera);
}

/* ══════════════════════════════════════
   JOIN
══════════════════════════════════════ */
document.getElementById('bjoin').addEventListener('click',async()=>{
  myName=(document.getElementById('iname').value.trim()||'Flubber').slice(0,16);
  document.getElementById('login').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('brush-hud').style.display='flex';
  document.getElementById('hint').style.display='flex';
  document.getElementById('plist').style.display='flex';
  document.getElementById('minimap-wrap').style.display='block';
  document.getElementById('status').style.display='block';
  document.getElementById('hdot').style.background=myColor;
  document.getElementById('hname').textContent=myName;
  setBrush(0);

  myId='p_'+Math.random().toString(36).slice(2,9);
  myMesh=makeFlubber(myColor);
  myMesh.add(makeLabel(myName,myColor));
  myMesh.position.set(spawnX,0,spawnZ);
  scene.add(myMesh);
  players[myId]={mesh:myMesh,tx:spawnX,tz:spawnZ,data:{name:myName,color:myColor}};
  updateCamera(); animate();

  try{
    const app=initializeApp(FB);
    db=getDatabase(app);
    myRef=ref(db,`players/${myId}`);
    onDisconnect(myRef).remove();
    set(myRef,{name:myName,color:myColor,x:spawnX,z:spawnZ,ts:Date.now()});

    // Charger peinture existante (clé = "cx_cz", valeur = couleur)
    const snap=await get(ref(db,'paint'));
    if(snap.exists()){
      const cells=[];
      Object.entries(snap.val()).forEach(([key,color])=>{
        if(typeof color !== 'string') return; // ignorer anciens formats
        const [cx,cz]=[parseInt(key.split('_')[0]),parseInt(key.split('_')[1])];
        if(isNaN(cx)||isNaN(cz)) return;
        const idx=cz*GRID_N+cx;
        if(grid[idx]===color) return;
        grid[idx]=color;
        cells.push({cx,cz,color});
      });
      paintCells(cells);
      console.log('Paint chargé:', cells.length, 'cellules');
    }

    // Joueurs
    onValue(ref(db,'players'),snap=>{
      const data=snap.val()||{};
      const seen=new Set();
      Object.entries(data).forEach(([id,pd])=>{
        if(id===myId)return; seen.add(id);
        players[id]?updatePlayer(id,pd):spawnPlayer(id,pd);
      });
      Object.keys(players).forEach(id=>{if(id!==myId&&!seen.has(id))removePlayer(id);});
      updateUI();
    });

    // Écouter les nouvelles cellules peintes en temps réel
    onValue(ref(db,'paint'),snap=>{
      if(!snap.exists())return;
      const cells=[];
      Object.entries(snap.val()).forEach(([key,color])=>{
        if(typeof color !== 'string') return;
        const [cx,cz]=[parseInt(key.split('_')[0]),parseInt(key.split('_')[1])];
        if(isNaN(cx)||isNaN(cz)) return;
        const idx=cz*GRID_N+cx;
        if(grid[idx]===color) return;
        grid[idx]=color;
        cells.push({cx,cz,color});
      });
      if(cells.length>0) paintCells(cells);
    });

    console.log('Firebase connecté, db=',db,'myRef=',myRef);
    document.getElementById('status').textContent='⬤ Connecté';
    document.getElementById('status').className='ok';
  }catch(e){
    console.error('Firebase erreur:', e);
    document.getElementById('status').textContent='⬤ Erreur Firebase: '+e.message;
    document.getElementById('status').className='err';
  }
});

function updateUI(){
  const list=document.getElementById('plist'); list.innerHTML=''; let n=0;
  Object.values(players).forEach(p=>{
    n++;
    const b=document.createElement('div'); b.className='pbadge';
    b.innerHTML=`<div class="pdot" style="background:${p.data.color}"></div><span>${p.data.name}</span>`;
    list.appendChild(b);
  });
  document.getElementById('hcount').textContent=n===1?'1 joueur':`${n} joueurs`;
}

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
